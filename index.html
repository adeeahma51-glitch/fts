/* ============================ ONE-TIME SETUP ============================ */

function setup() {
  editorOnly_();
  resetCaches_();
  const props = PropertiesService.getScriptProperties();
  if (!props.getProperty('SECRET')) props.setProperty('SECRET', Utilities.getUuid() + Utilities.getUuid());
  let ss = null;
  try { ss = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) { ss = null; }
  if (!ss) {
    const id = props.getProperty('SHEET_ID');
    ss = id ? SpreadsheetApp.openById(id) : SpreadsheetApp.create('FTS — BISE Sahiwal (Data)');
  }
  props.setProperty('SHEET_ID', ss.getId());
  [SHEETS.UNITS, SHEETS.USERS, SHEETS.DAK, SHEETS.LOG, SHEETS.HOL, SHEETS.TR, SHEETS.DOCS].forEach(function (n) { ensureSheet_(ss, n, SHEET_FIELDS[n]); });
  const blank = ss.getSheetByName('Sheet1');
  if (blank && ss.getSheets().length > 7 && blank.getLastRow() === 0) ss.deleteSheet(blank);
  if (!props.getProperty('FOLDER_ID')) props.setProperty('FOLDER_ID', DriveApp.createFolder('FTS BISE Files').getId());
  SS_ = ss;
  if (!table_(SHEETS.UNITS, UNIT_FIELDS).rows.length) seedUnits_();
  if (!readUsers_().some(function (u) { return !u.deleted; })) seedPeople_();
  if (!props.getProperty('STAFF_IMPORTED')) { const n = seedStaff_(); props.setProperty('STAFF_IMPORTED', String(n)); }
  SpreadsheetApp.flush();
  Logger.log('Setup complete.  Data sheet: ' + ss.getUrl());
  logUsers_();
}

/** LOGIN PROBLEM? Run "resetAllPins": every PIN becomes 1234 and lock-outs are cleared. Nothing else changes. */
function resetAllPins() {
  editorOnly_();
  resetCaches_();
  if (!PropertiesService.getScriptProperties().getProperty('SHEET_ID')) { setup(); return; }
  withLock_(function () {
    if (!table_(SHEETS.UNITS, UNIT_FIELDS).rows.length) seedUnits_();
    const t = table_(SHEETS.USERS, USER_FIELDS);
    if (!t.rows.some(function (u) { return !u.deleted; })) { seedPeople_(); return; }
    t.rows.forEach(function (u) {
      if (u.deleted || (!u.pinHash && !u.sysAdmin)) return;      // staff without an app login stay without one
      u.pinHash = hashPin_(u.username, '1234');
      writeRow_(t.sh, u._row, USER_FIELDS, u);
    });
  });
  const cache = CacheService.getScriptCache();
  readUsers_().forEach(function (u) { cache.remove('fail_' + u.username); });
  Logger.log('All PINs reset to 1234. Ask everyone to change their PIN (Me → Change PIN).');
  logUsers_();
}

function seedUnits_() {
  const sh = sheet_(SHEETS.UNITS), now = Date.now();
  ORG_SEED.units.forEach(function (u, i) {
    writeRow_(sh, i + 2, UNIT_FIELDS, { id: u[0], name: u[1], parent: u[2], kind: u[3] || 'BRANCH', order: i + 1, createdAt: now });
  });
  UNITS_ = null;
}

function seedPeople_() {
  const sh = sheet_(SHEETS.USERS), now = Date.now();
  ORG_SEED.people.forEach(function (p, i) {
    writeRow_(sh, i + 2, USER_FIELDS, {
      username: p[0], name: p[1], designation: p[2], role: p[3], units: p[4], sysAdmin: !!p[5],
      pinHash: hashPin_(p[0], '1234'), active: true, deleted: false, createdAt: now
    });
  });
  USERS_ = null;
}

/** Adds the staff statement to People. Officers already in the list are matched by name (their units stay as set). */
function seedStaff_() {
  const t = table_(SHEETS.USERS, USER_FIELDS), now = Date.now();
  const taken = {}; t.rows.forEach(function (u) { taken[u.username] = 1; });
  const live = t.rows.filter(function (u) { return !u.deleted; });
  const keyOf = STAFF_SEED.map(function (r) { return nameKey_(r[2]); });
  const match = {};
  // 1) same name in the same unit (e.g. the Superintendent who heads his branch)
  STAFF_SEED.forEach(function (r, i) {
    const hit = live.filter(function (u) { return !u._staffed && nameKey_(u.name) === keyOf[i] && unitIds_(u).indexOf(r[1]) >= 0; })[0];
    if (hit) { hit._staffed = true; match[i] = hit; }
  });
  // 2) an officer posted in one branch who heads another — only when his name appears once in the statement
  STAFF_SEED.forEach(function (r, i) {
    if (match[i] || keyOf.filter(function (k) { return k === keyOf[i]; }).length !== 1) return;
    const hit = live.filter(function (u) { return !u._staffed && u.role === 'HEAD' && nameKey_(u.name) === keyOf[i]; })[0];
    if (hit) { hit._staffed = true; match[i] = hit; }
  });
  const fresh = [];
  STAFF_SEED.forEach(function (r, i) {
    const hit = match[i];
    if (hit) {
      // already in the list (also re-running the import): only fill the statement columns
      hit.bps = r[4]; hit.appt = r[5]; hit.cell = r[6]; hit.sr = String(r[0]);
      if (unitIds_(hit).indexOf(r[1]) < 0) hit.remarks = 'Posted in ' + unitName_(r[1]) + (r[7] ? ' · ' + r[7] : '');
      else if (r[7]) hit.remarks = r[7];
      writeRow_(t.sh, hit._row, USER_FIELDS, hit);
      return;
    }
    fresh.push({ username: newUsername_(r[2], taken), name: r[2], designation: r[3], role: 'STAFF', pinHash: '', active: true, deleted: false, createdAt: now,
      units: r[1], sysAdmin: false, bps: r[4], appt: r[5], cell: r[6], remarks: r[7], sr: String(r[0]) });
  });
  writeRows_(t.sh, t.sh.getLastRow() + 1, USER_FIELDS, fresh);
  USERS_ = null;
  return fresh.length;
}

/** Run this once from the editor if the app was set up before the staff statement was added. Safe to run again: nobody is added twice. */
function importStaffStatement() {
  editorOnly_();
  resetCaches_();
  const n = withLock_(seedStaff_);
  PropertiesService.getScriptProperties().setProperty('STAFF_IMPORTED', String(n));
  Logger.log(n + ' employees added from the staff statement.');
}

/** "Mr. Muhammad Rafiq" and "Muhammad Rafiq" are the same person. */
function nameKey_(n) {
  return String(n || '').toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(function (w) {
    return w && ['mr', 'mrs', 'ms', 'dr', 'hafiz', 'haf', 'syed', 'sayed', 'muhammad', 'mohammad', 'muhammed', 'm'].indexOf(w) < 0;
  }).join(' ');
}
/** A short login name from the person's name: "Muhammad Sanaullah" → "sanaullah". */
function newUsername_(name, taken) {
  const skip = ['mr', 'mrs', 'ms', 'dr', 'hafiz', 'haf', 'syed', 'sayed', 'muhammad', 'muhammed', 'mohammad', 'm', 'ch', 'rana', 'malik', 'mian', 'rao', 'ul', 'ur', 'uz'];
  const w = String(name || '').toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean);
  const core = w.filter(function (x) { return skip.indexOf(x) < 0; });
  const words = core.length ? core : (w.length ? w : ['user']);
  let base = words[0].slice(0, 20);
  if (taken[base] && words[1]) base = (words[0] + '.' + words[1]).slice(0, 26);
  let u = base, n = 2;
  while (taken[u] || u.length < 2) u = base + (n++);
  taken[u] = 1;
  return u;
}

function logUsers_() {
  const list = readUsers_().filter(function (u) { return !u.deleted && u.pinHash; });
  Logger.log(list.length + ' people with an app login (PIN 1234 unless changed):');
  list.forEach(function (u) {
    Logger.log('   ' + u.username + '  —  ' + u.name + '  (' + u.role + (u.sysAdmin ? ', System Admin' : '') + ')  ' +
      userUnits_(u).map(function (x) { return unitName_(x.id) + (x.charge ? ' [' + x.charge + ']' : ''); }).join(', '));
  });
}

/** Optional: e-mail every working morning with overdue files, grouped by where they are lying. */
function installDailyEmail() {
  editorOnly_();
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'dailyDigest') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('dailyDigest').timeBased().everyDays(1).atHour(CONFIG.DIGEST_HOUR).inTimezone('Asia/Karachi').create();
  Logger.log('Daily e-mail installed. It goes to: ' + digestEmail_());
}

function dailyDigest() {
  resetCaches_();
  const now = Date.now();
  if (isOffDay_(new Date(now + CONFIG.PK_OFFSET_HOURS * 36e5))) return;
  const names = {};
  readUsers_().forEach(function (u) { names[u.username] = u.name; });
  const overdue = table_(SHEETS.DAK, DAK_FIELDS).rows.filter(function (d) {
    return (d.status === STATUS.MARKED || d.status === STATUS.IN_PROGRESS) && d.deadline && d.deadline < now;
  }).sort(function (a, b) { return a.deadline - b.deadline; });
  if (!overdue.length) return;
  const cell = 'style="border:1px solid #ddd;padding:6px 8px;text-align:left"';
  let html = '<p><b>' + overdue.length + '</b> files are pending beyond their deadline.</p>' +
    '<table style="border-collapse:collapse;font-family:Arial;font-size:13px"><tr><th ' + cell + '>Lying in</th><th ' + cell + '>With</th><th ' + cell +
    '>Diary No</th><th ' + cell + '>Subject</th><th ' + cell + '>Late by</th></tr>';
  overdue.forEach(function (d) {
    html += '<tr><td ' + cell + '>' + esc_(unitName_(d.curUnit || d.branch)) + '</td><td ' + cell + '>' + esc_(names[d.assignedTo] || d.assignedTo) +
      '</td><td ' + cell + '>' + esc_(d.diaryNo) + '</td><td ' + cell + '>' + esc_(d.subject) + '</td><td ' + cell + '>' + lateBy_(now - d.deadline) + '</td></tr>';
  });
  MailApp.sendEmail({ to: digestEmail_(), subject: CONFIG.APP_NAME + ': ' + overdue.length + ' overdue files', htmlBody: html + '</table>' });
}


/* ============================ WEB ENTRY POINTS ============================ */

function doGet(e) {
  const out = HtmlService.createHtmlOutputFromFile('Index')
    .setTitle(CONFIG.APP_NAME)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
  // a QR label scanned with the phone camera opens  …/exec?f=12-K7Q2M9  → open that file's Move / Receive screen
  const f = String((e && e.parameter && e.parameter.f) || '').toUpperCase();
  const tag = 'script';   // written in two parts so this file can also be embedded inside a page
  if (/^\d{1,9}-[A-Z0-9]{6}$/.test(f)) out.append('<' + tag + '>window.FTS_SCAN = "' + f + '"; try { if (S.me) pendingScan(); } catch (x) {}</' + tag + '>');
  return out;
}
/** The web-app link of this deployment (…/exec), used inside QR labels. */
function execUrl_() { try { return ScriptApp.getService().getUrl() || ''; } catch (e) { return ''; } }

function doPost(e) {
  const out = api(e && e.postData ? e.postData.contents : '{}');
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}

function api(req) {
  resetCaches_();
  try {
    if (typeof req === 'string') req = JSON.parse(req || '{}');
    req = req || {};
    if (req.action === 'ping') return { ok: true, data: { app: CONFIG.APP_NAME } };
    if (req.action === 'login') return { ok: true, data: login_(req) };
    const me = auth_(req.token);
    const fn = ACTIONS[req.action];
    if (!fn) throw new Error('Unknown action');
    return { ok: true, data: fn(me, req) };
  } catch (err) {
    return { ok: false, error: String((err && err.message) || err) };
  }
}

const ACTIONS = {

  load: function (me, req) {
    const cutoff = Date.now() - CONFIG.HISTORY_DAYS * 864e5;
    const files = table_(SHEETS.DAK, DAK_FIELDS).rows.filter(function (d) {
      return canSee_(me, d) && (req.all || !isClosed_(d) || closedAt_(d) >= cutoff);
    });
    const cfg = {
      weekend: CONFIG.WEEKEND_DAYS, closeHour: CONFIG.OFFICE_CLOSE_HOUR, offset: CONFIG.PK_OFFSET_HOURS,
      org: CONFIG.ORG, units: readUnits_(), maxUnits: CONFIG.MAX_UNITS, appUrl: CONFIG.APP_URL, execUrl: execUrl_(), holidays: readHolidays_()
    };
    if (me.sysAdmin) cfg.sheetUrl = 'https://docs.google.com/spreadsheets/d/' + prop_('SHEET_ID');
    cfg.hr = { view: isHrView_(me), edit: isHrEdit_(me), appts: APPTS };
    cfg.docTypes = DOC_TYPES; cfg.categories = CATEGORIES; cfg.heldUpDays = CONFIG.HELD_UP_DAYS;
    const pub = publicUser_(me, me);
    pub.scope = scopeIds_(me);
    const out = { me: pub, users: visiblePeople_(me).map(function (u) { return publicUser_(u, me); }), dak: files.map(clientDak_), cfg: cfg, serverTime: Date.now() };
    if (cfg.hr.view) out.transfers = readTransfers_(200);
    return out;
  },

  /** Create a file. Officers / Dak Incharge: in any unit under them. Any other user: in his own branch, and the file starts in his hands. */
  addDak: function (me, req) {
    const admin = isAdmin_(me);
    const f = req.dak || {};
    if (!str_(f.subject)) throw new Error('Subject is required');
    const unit = str_(f.branch) || unitIds_(me)[0];
    if (!unit || !(admin ? inScope_(me, unit) : unitIds_(me).indexOf(unit) >= 0)) throw new Error(admin ? 'This unit is not under your charge' : 'You can create files of your own branch only');
    if (req.freeze && !admin) throw new Error('Only an officer can freeze a file');
    const file = req.file ? saveFile_(req.file, 'new') : null;
    return withLock_(function () {
      const now = Date.now();
      const id = nextId_();
      const d = {
        id: id,
        diaryNo: str_(f.diaryNo) || fileNo_(unit, id, str_(f.receivedOn) || pkDate_(now)),
        receivedOn: str_(f.receivedOn) || pkDate_(now),
        fromOffice: str_(f.fromOffice), subject: str_(f.subject).toUpperCase(), letterNo: '', letterDate: '',   // titles are always in CAPITALS
        priority: PRIORITIES.indexOf(f.priority) >= 0 ? f.priority : 'Normal',
        instructions: str_(f.instructions), status: STATUS.RECEIVED, category: str_(f.category).slice(0, 60),
        assignedTo: '', assignedBy: '', assignedAt: null, deadline: null, startedAt: null, completedAt: null,
        reply: '', fileId: file ? file.id : '', fileName: file ? file.name : '',
        createdBy: me.username, createdAt: now, updatedAt: now, branch: unit, curUnit: unit, handledBy: me.username, qr: newQr_(), rcvdAt: now
      };
      log_(id, me, 'File opened', d.subject, { toUnit: unit });
      if (req.freeze) applyFreeze_(d, me, req, now);
      else if (str_(req.assignTo)) applyAssign_(d, me, req, now);
      else if (!admin) {                       // a clerk's own file: it is with him till he moves it
        d.assignedTo = me.username; d.assignedBy = me.username; d.assignedAt = now; d.startedAt = now;
        d.status = STATUS.IN_PROGRESS; d.deadline = deadlineFrom_(now, PRIO_DAYS[d.priority]);
      }
      writeRow_(sheet_(SHEETS.DAK), sheet_(SHEETS.DAK).getLastRow() + 1, DAK_FIELDS, d);
      return clientDak_(d);
    });
  },

  /** Send / mark / forward a file to anyone: down, up or across. The person holding it, or any officer over it, can send it. */
  assign: function (me, req) {
    return updateDak_(req.id, function (d, now) {
      if (d.status === STATUS.STORED) throw new Error('This file is in the record — take it out of record first');
      const holder = d.assignedTo === me.username && d.status !== STATUS.COMPLETED;
      if (!holder && !canManage_(me, d)) throw new Error('You can send this file only while it is with you');
      applyAssign_(d, me, req, now);
    });
  },

  freeze: function (me, req) {
    return updateDak_(req.id, function (d, now) {
      requireManage_(me, d);
      if (d.status === STATUS.COMPLETED) throw new Error('This file is already completed');
      if (d.status === STATUS.STORED) throw new Error('This file is in the record — take it out of record first');
      applyFreeze_(d, me, req, now);
    });
  },

  extend: function (me, req) {
    return updateDak_(req.id, function (d, now) {
      requireManage_(me, d);
      if (d.status !== STATUS.MARKED && d.status !== STATUS.IN_PROGRESS) throw new Error('Only open, marked files can be extended (a frozen file is un-frozen by sending it again)');
      const old = d.deadline;
      d.deadline = deadlineFrom_(now, req.days, req.deadlineDate);
      log_(d.id, me, 'Time extended', pkStr_(old) + '  →  ' + pkStr_(d.deadline) + (str_(req.note) ? '  ·  ' + str_(req.note) : ''), { due: d.deadline });
    });
  },

  start: function (me, req) {
    return updateDak_(req.id, function (d, now) {
      if (d.assignedTo !== me.username) throw new Error('This file is not with you');
      if (d.status !== STATUS.MARKED) throw new Error('This file is not waiting to be started');
      d.status = STATUS.IN_PROGRESS;
      d.startedAt = now;
      d.rcvdAt = d.rcvdAt || now;
      log_(d.id, me, 'File received', 'Work started');
    });
  },

  note: function (me, req) {
    const text = str_(req.note);
    if (!text) throw new Error('Please write something');
    return updateDak_(req.id, function (d) { requireSee_(me, d); addHandled_(d, me.username); log_(d.id, me, 'Note', text, { remark: text, toUnit: d.curUnit || d.branch }); });
  },

  complete: function (me, req) {
    const reply = str_(req.reply);
    if (!reply) throw new Error('Please write the action taken / disposal');
    return updateDak_(req.id, function (d, now) {
      if (d.assignedTo !== me.username && !canManage_(me, d)) throw new Error('Only the person holding this file, or an officer over it, can complete it');
      if (d.status === STATUS.RECEIVED) throw new Error('Mark this file to someone first');
      if (d.status === STATUS.COMPLETED) throw new Error('Already completed');
      if (d.status === STATUS.STORED) throw new Error('This file is in the record — take it out of record first');
      d.status = STATUS.COMPLETED;
      d.completedAt = now;
      d.reply = reply;
      if (!d.startedAt) d.startedAt = now;
      addHandled_(d, me.username);
      log_(d.id, me, d.deadline && now > d.deadline ? 'Completed (late)' : 'Completed', reply, { toUnit: d.curUnit, remark: reply });
    });
  },

  reopen: function (me, req) {
    return updateDak_(req.id, function (d, now) {
      requireManage_(me, d);
      if (d.status !== STATUS.COMPLETED) throw new Error('This file is not completed');
      d.status = STATUS.IN_PROGRESS;
      d.completedAt = null;
      d.deadline = deadlineFrom_(now, req.days, req.deadlineDate);
      log_(d.id, me, 'Reopened', 'New deadline ' + pkStr_(d.deadline) + (str_(req.note) ? '  ·  ' + str_(req.note) : ''),
        { toUser: d.assignedTo, toUnit: d.curUnit, due: d.deadline });
    });
  },

  /** The secret code printed in the file's QR label (made for older files on first use). */
  qrCode: function (me, req) {
    return updateDak_(req.id, function (d) { requireSee_(me, d); if (!d.qr) d.qr = newQr_(); });
  },

  /** Someone scanned the QR on a file: show where the app thinks it is, so he can receive it — or return it. */
  scan: function (me, req) {
    const d = getDak_(req.id);
    checkQr_(d, req.code);
    return {
      file: { id: d.id, diaryNo: d.diaryNo, subject: d.subject, priority: d.priority, status: d.status, branch: d.branch, curUnit: d.curUnit || d.branch,
        assignedTo: d.assignedTo, assignedBy: d.assignedBy, assignedAt: d.assignedAt, fromOffice: d.fromOffice, storeLoc: d.storeLoc,
        rcvdAt: d.rcvdAt, createdAt: d.createdAt, deadline: d.deadline },
      seen: canSee_(me, d), holder: d.assignedTo === me.username, manage: canManage_(me, d), back: backFor_(d, me)
    };
  },

  /** QR scan: "File received" — the file is now in my branch, marked to the person chosen (by default the branch officer). */
  scanReceive: function (me, req) {
    return updateDak_(req.id, function (d, now) {
      checkQr_(d, req.code);
      const mine = unitIds_(me);
      const unit = str_(req.unit) || mine[0];
      if (mine.indexOf(unit) < 0) throw new Error('A file can be received only in your own branch');
      const to = findUser_(str_(req.assignTo) || me.username);
      if (!to || to.deleted || !to.active || !to.pinHash || unitIds_(to).indexOf(unit) < 0) throw new Error('Choose a person of ' + unitName_(unit));
      if (d.status === STATUS.STORED) { log_(d.id, me, 'Taken out of record', 'From ' + d.storeLoc + '  ·  by QR scan', { toUnit: d.curUnit || d.branch }); d.storedAt = null; }
      addHandled_(d, me.username);
      const here = (d.curUnit || d.branch) === unit && d.assignedTo === to.username;
      if (here && (d.status === STATUS.MARKED || d.status === STATUS.IN_PROGRESS || d.status === STATUS.FROZEN)) {
        log_(d.id, me, 'Receipt confirmed (QR scan)', unitName_(unit), { toUnit: unit });
        d.rcvdAt = now;
        if (d.status === STATUS.MARKED && to.username === me.username) { d.status = STATUS.IN_PROGRESS; d.startedAt = now; }
        return;
      }
      const pr = PRIORITIES.indexOf(d.priority) >= 0 ? d.priority : 'Normal';
      applyAssign_(d, me, { assignTo: to.username, unit: unit, days: PRIO_DAYS[pr] }, now, 'Received (QR scan)', str_(req.note));
    });
  },

  /** e-FOAS style documents in a file: PUC, DFA, letters, office orders, notifications, summaries … */
  addDoc: function (me, req) {
    const d = getDak_(req.id);
    requireSee_(me, d);
    const x = req.doc || {};
    const type = DOC_TYPES.indexOf(str_(x.type)) >= 0 ? str_(x.type) : 'Other';
    const title = str_(x.title).slice(0, 150) || type;
    if (!req.file) throw new Error('Choose the photo or PDF of the document');
    const f = saveFile_(req.file, d.id);
    return withLock_(function () {
      const t = table_(SHEETS.DOCS, DOC_FIELDS);
      let n = 0; t.rows.forEach(function (r) { n = Math.max(n, parseInt(String(r.id).replace(/\D/g, ''), 10) || 0); });
      writeRow_(t.sh, t.sh.getLastRow() + 1, DOC_FIELDS, { id: 'D' + (n + 1), dakId: d.id, type: type, title: title, docDate: str_(x.docDate) || pkDate_(Date.now()),
        fileId: f.id, fileName: f.name, by: me.username, at: Date.now() });
      log_(d.id, me, 'Document added', type.split(' (')[0] + ': ' + title, { toUnit: d.curUnit || d.branch });
      return listDocs_(d.id);
    });
  },
  docs: function (me, req) { requireSee_(me, getDak_(req.id)); return listDocs_(req.id); },
  docFile: function (me, req) {
    const doc = table_(SHEETS.DOCS, DOC_FIELDS).rows.filter(function (r) { return r.id === str_(req.docId); })[0];
    if (!doc) throw new Error('Document not found');
    requireSee_(me, getDak_(doc.dakId));
    const blob = DriveApp.getFileById(doc.fileId).getBlob();
    return { name: doc.fileName || blob.getName(), mime: blob.getContentType(), data: Utilities.base64Encode(blob.getBytes()) };
  },

  /** Dispatch / receipt register: every movement in a period — from which office to which, and receipts. */
  movements: function (me, req) {
    requireAdmin_(me);
    const from = pkParse_(req.from) || 0, to = pkParse_(req.to) ? pkParse_(req.to) + 864e5 : Date.now() + 6e4;
    const files = {}; table_(SHEETS.DAK, DAK_FIELDS).rows.forEach(function (d) { files[d.id] = d; });
    const logs = table_(SHEETS.LOG, LOG_FIELDS).rows.slice().sort(function (a, b) { return a.time - b.time; });
    const at = {}, out = [];
    logs.forEach(function (l) {
      const d = files[l.dakId];
      if (!d) return;
      const before = at[l.dakId] || d.branch;
      let kind = '', fromU = before, toU = l.toUnit || before;
      if (l.action === 'File opened') { kind = 'Opened'; fromU = ''; toU = l.toUnit || d.branch; }
      else if (MOVE_RE_.test(l.action) && l.toUser) kind = /^Returned/.test(l.action) ? 'Returned' : /^Received/.test(l.action) ? 'Received' : 'Sent';
      else if (/^Receipt confirmed/.test(l.action) || l.action === 'File received') { kind = 'Received'; fromU = ''; toU = before; }
      else if (l.action === 'Stored in record') kind = 'Record';
      if (kind) at[l.dakId] = toU;
      if (!kind || !(l.time >= from && l.time < to) || !canSee_(me, d)) return;
      out.push({ time: l.time, kind: kind, action: l.action, dakId: d.id, diaryNo: d.diaryNo, subject: d.subject, category: d.category,
        from: fromU, to: toU, by: l.user, toUser: l.toUser, remark: l.remark });
    });
    return out.slice(-2000);
  },

  /** QR scan in the office where the file is: "Move file" — to the office chosen from the list, and the person there. */
  scanMove: function (me, req) {
    return updateDak_(req.id, function (d, now) {
      checkQr_(d, req.code);
      const here = d.curUnit || d.branch;
      if (unitIds_(me).indexOf(here) < 0 && d.assignedTo !== me.username && !canManage_(me, d)) throw new Error('This file is not in your office. Scan it as "File received" first.');
      if (d.status === STATUS.STORED) throw new Error('This file is in the record — take it out of record first');
      const unit = str_(req.unit);
      if (!unitById_(unit)) throw new Error('Choose the office the file is going to');
      const to = findUser_(str_(req.assignTo));
      if (!to || to.deleted || !to.active || !to.pinHash || unitIds_(to).indexOf(unit) < 0) throw new Error('Choose a person of ' + unitName_(unit));
      if (to.username === d.assignedTo && unit === here) throw new Error('The file is already with ' + to.name);
      const pr = PRIORITIES.indexOf(req.priority) >= 0 ? req.priority : (PRIORITIES.indexOf(d.priority) >= 0 ? d.priority : 'Normal');
      addHandled_(d, me.username);
      applyAssign_(d, me, { assignTo: to.username, unit: unit, days: req.days != null && req.days !== '' ? req.days : PRIO_DAYS[pr], priority: pr, instructions: req.instructions }, now, 'Sent (QR scan)');
    });
  },

  /** "This file does not belong to us" — it goes back to the person who sent it, in the office he sent it from. */
  returnFile: function (me, req) {
    const reason = str_(req.reason).slice(0, 200) || 'Does not belong to us';
    return updateDak_(req.id, function (d, now) {
      if (str_(req.code)) checkQr_(d, req.code);
      else if (d.assignedTo !== me.username && !canManage_(me, d)) throw new Error('Only the person who got this file, or an officer over it, can return it');
      if (isClosed_(d)) throw new Error('This file is already closed');
      const back = backFor_(d, me);
      if (!back.user) throw new Error('It is not known who sent this file');
      if (back.user === d.assignedTo && back.unit === (d.curUnit || d.branch)) {
        log_(d.id, me, 'Returned — not ours', 'Back to ' + (back.name || back.user) + ' (' + unitName_(back.unit) + ')  ·  ' + reason, { toUnit: back.unit });
        return;
      }
      addHandled_(d, me.username);
      applyAssign_(d, me, { assignTo: back.user, unit: back.unit, days: 1 }, now, 'Returned — not ours', reason);
    });
  },

  /** Put a file away in the record room / almirah — after disposal, or "file may be filed". */
  store: function (me, req) {
    const loc = str_(req.location);
    if (!loc) throw new Error('Please write where the file is being kept (e.g. Record Room, Almirah 3, Rack 2)');
    return updateDak_(req.id, function (d, now) {
      if (d.status === STATUS.STORED) throw new Error('This file is already in the record');
      if (d.assignedTo !== me.username && !canManage_(me, d)) throw new Error('Only the person holding this file, or an officer over it, can put it in record');
      const unit = str_(req.unit);
      if (unit) { if (!unitById_(unit)) throw new Error('Unknown unit'); d.curUnit = unit; }
      const note = str_(req.note);
      addHandled_(d, me.username);
      d.status = STATUS.STORED;
      d.storedAt = now;
      d.storeLoc = loc;
      d.assignedTo = '';
      d.deadline = null;
      log_(d.id, me, 'Stored in record', loc + '  ·  ' + unitName_(d.curUnit || d.branch) + (note ? '  ·  ' + note : ''), { toUnit: d.curUnit || d.branch });
    });
  },

  /** Take a file out of the record and give it to someone (or to yourself). */
  retrieve: function (me, req) {
    return updateDak_(req.id, function (d, now) {
      if (d.status !== STATUS.STORED) throw new Error('This file is not in the record');
      if (!canManage_(me, d) && !handled_(d, me)) throw new Error('You cannot take this file out of record');
      const r = {};
      Object.keys(req).forEach(function (k) { r[k] = req[k]; });
      if (!str_(r.assignTo)) { r.assignTo = me.username; if (unitIds_(me).indexOf(str_(r.unit)) < 0) r.unit = unitIds_(me)[0]; }
      log_(d.id, me, 'Taken out of record', 'From ' + d.storeLoc + (str_(req.note) ? '  ·  ' + str_(req.note) : ''), { toUnit: d.curUnit || d.branch });
      d.storedAt = null;
      applyAssign_(d, me, r, now);
    });
  },

  edit: function (me, req) {
    const f = req.dak || {};
    return updateDak_(req.id, function (d) {
      requireManage_(me, d);
      if (str_(f.branch) && str_(f.branch) !== d.branch) {
        if (!inScope_(me, str_(f.branch))) throw new Error('That unit is not under your charge');
        d.branch = str_(f.branch);
      }
      EDITABLE.forEach(function (k) { if (k in f) d[k] = str_(f[k]); });
      d.subject = str_(d.subject).toUpperCase();
      if (PRIORITIES.indexOf(d.priority) < 0) d.priority = 'Normal';
      if (!d.subject) throw new Error('Subject is required');
      log_(d.id, me, 'Details edited', '');
    });
  },

  attach: function (me, req) {
    requireManage_(me, getDak_(req.id));
    const file = saveFile_(req.file, req.id);
    return updateDak_(req.id, function (d) {
      d.fileId = file.id; d.fileName = file.name;
      log_(d.id, me, 'File attached', file.name);
    });
  },

  history: function (me, req) {
    requireSee_(me, getDak_(req.id));
    return table_(SHEETS.LOG, LOG_FIELDS).rows
      .filter(function (r) { return String(r.dakId) === String(req.id); })
      .map(function (r) { return { time: r.time, user: r.user, action: r.action, note: r.note, toUser: r.toUser, toUnit: r.toUnit, due: r.due, remark: r.remark }; });
  },

  file: function (me, req) {
    const d = getDak_(req.id);
    requireSee_(me, d);
    if (!d.fileId) throw new Error('No scan attached');
    const blob = DriveApp.getFileById(d.fileId).getBlob();
    return { name: d.fileName || blob.getName(), mime: blob.getContentType(), data: Utilities.base64Encode(blob.getBytes()) };
  },

  addHoliday: function (me, req) {
    requireSys_(me);
    const title = str_(req.title).slice(0, 80);
    const from = str_(req.from), to = str_(req.to) || from;
    if (!title) throw new Error('Please write the holiday name');
    const a = pkParse_(from), b = pkParse_(to);
    if (!a || !b) throw new Error('Please choose the date');
    if (b < a) throw new Error('"To" date is before "From" date');
    if ((b - a) / 864e5 > 31) throw new Error('A holiday can be at most 31 days long');
    return withLock_(function () {
      const before = holidayMap_();
      const fresh = expandDates_(from, to).filter(function (ds) {
        return !before[ds] && CONFIG.WEEKEND_DAYS.indexOf(new Date(ds + 'T00:00:00Z').getUTCDay()) < 0;
      });
      const sh = sheet_(SHEETS.HOL);
      writeRow_(sh, sh.getLastRow() + 1, HOL_FIELDS, {
        id: Utilities.getUuid().slice(0, 8), from: pkDate_(a), to: pkDate_(b), title: title, addedBy: me.username, addedAt: Date.now()
      });
      HOL_ = null;
      const moved = req.shift === false ? 0 : shiftForHoliday_(me, fresh, title);
      return { holidays: readHolidays_(), moved: moved };
    });
  },

  deleteHoliday: function (me, req) {
    requireSys_(me);
    return withLock_(function () {
      const t = table_(SHEETS.HOL, HOL_FIELDS);
      const i = indexOf_(t.rows, 'id', str_(req.id));
      if (i < 0) throw new Error('Holiday not found');
      t.sh.deleteRow(t.rows[i]._row);
      HOL_ = null;
      return { holidays: readHolidays_() };
    });
  },

  /** Add / edit a person. System Admin: anyone. Head: Dak Incharge & Staff in his units. Dak Incharge: Staff in his units. */
  saveUser: function (me, req) {
    requireAdmin_(me);
    const u = req.user || {};
    const username = str_(u.username).toLowerCase();
    if (!/^[a-z0-9._-]{2,30}$/.test(username)) throw new Error('Username: 2–30 letters/numbers, no spaces');
    const role = normRole_(u.role) || 'STAFF';
    const pin = str_(u.pin);
    if (pin && !/^\d{4,8}$/.test(pin)) throw new Error('PIN must be 4–8 digits');
    return withLock_(function () {
      const t = table_(SHEETS.USERS, USER_FIELDS);
      const idx = indexOf_(t.rows, 'username', username);
      const found = idx >= 0 ? t.rows[idx] : null;
      const old = found && !found.deleted ? found : null;
      const self = old && old.username === me.username;
      if (!me.sysAdmin && !self) {
        if (me.role === 'HEAD' && (role === 'HEAD' || (old && old.role === 'HEAD'))) throw new Error('Only the System Admin can add or edit officers (Heads)');
        if (me.role !== 'HEAD' && (role !== 'STAFF' || (old && old.role !== 'STAFF'))) throw new Error('Dak Incharge can add or edit Staff only');
        if (old && !sharesScope_(me, old)) throw new Error('This person is not in your units');
      }
      if (self && (role !== me.role || u.active === false)) throw new Error('You cannot change your own role or deactivate yourself');
      if (!old && !pin) throw new Error('Set a 4–8 digit PIN for the new person');

      let list;
      if (!Array.isArray(u.units) || (self && !me.sysAdmin)) list = old ? userUnits_(old) : [];
      else {
        const allowed = me.sysAdmin ? readUnits_().map(function (x) { return x.id; }) : scopeIds_(me);
        const asked = u.units.map(function (b) {
          return { id: str_(b && b.id), charge: CHARGES.indexOf(b && b.charge) >= 0 ? b.charge : 'Additional' };
        }).filter(function (b) { return allowed.indexOf(b.id) >= 0; });
        const kept = old ? userUnits_(old).filter(function (b) { return allowed.indexOf(b.id) < 0; }) : [];
        list = [];
        kept.concat(asked).forEach(function (b) { if (!list.some(function (x) { return x.id === b.id; })) list.push(b); });
      }
      if (role !== 'HEAD') list = list.map(function (b) { return { id: b.id, charge: '' }; });
      if (!list.length) throw new Error('Choose at least one branch / unit');
      if (list.length > CONFIG.MAX_UNITS) throw new Error('One person can be in at most ' + CONFIG.MAX_UNITS + ' units');

      const o = old || { username: username, createdAt: Date.now() };
      o.name = str_(u.name) || username;
      o.designation = str_(u.designation);
      o.role = role;
      o.active = old ? u.active !== false : true;
      o.deleted = false;
      o.units = fmtUnits_(list);
      if (me.sysAdmin && typeof u.sysAdmin === 'boolean' && !self) o.sysAdmin = u.sysAdmin;
      else if (!old) o.sysAdmin = false;
      if (pin) o.pinHash = hashPin_(username, pin);
      writeRow_(t.sh, found ? found._row : t.sh.getLastRow() + 1, USER_FIELDS, o);
      return publicUser_(o, me);
    });
  },

  deleteUser: function (me, req) {
    requireAdmin_(me);
    const username = str_(req.username).toLowerCase();
    if (username === me.username) throw new Error('You cannot delete yourself');
    return withLock_(function () {
      const t = table_(SHEETS.USERS, USER_FIELDS);
      const idx = indexOf_(t.rows, 'username', username);
      if (idx < 0 || t.rows[idx].deleted) throw new Error('Person not found');
      const u = t.rows[idx];
      if (u.sysAdmin && !me.sysAdmin) throw new Error('Only the System Admin can remove a System Admin');
      if (!me.sysAdmin && !isHrEdit_(me)) {
        if (me.role === 'HEAD' && u.role === 'HEAD') throw new Error('Only the System Admin can delete officers');
        if (me.role !== 'HEAD' && u.role !== 'STAFF') throw new Error('Dak Incharge can delete Staff only');
        if (!sharesScope_(me, u)) throw new Error('This person is not in your units');
      }
      const pending = table_(SHEETS.DAK, DAK_FIELDS).rows.filter(function (d) {
        return d.assignedTo === u.username && (d.status === STATUS.MARKED || d.status === STATUS.IN_PROGRESS || d.status === STATUS.FROZEN);
      }).length;
      if (pending) throw new Error(u.name + ' still holds ' + pending + ' pending file(s). Send them to someone else first.');
      if (u.sysAdmin && !t.rows.some(function (x) { return x.sysAdmin && !x.deleted && x.username !== u.username; })) throw new Error('At least one System Admin must remain');
      u.deleted = true; u.active = false; u.pinHash = '';
      writeRow_(t.sh, u._row, USER_FIELDS, u);
      logTransfer_(me, 'LEFT', u, unitIds_(u).join(','), '', req);
      CacheService.getScriptCache().remove('fail_' + u.username);
      return { username: u.username };
    });
  },

  /** System Admin: add an office / branch / section anywhere in the structure. */
  addUnit: function (me, req) {
    requireSys_(me);
    const name = str_(req.name).slice(0, 80), parent = str_(req.parent);
    const kind = req.kind === 'WING' ? 'WING' : 'BRANCH';
    if (!name) throw new Error('Please write the name');
    if (!unitById_(parent)) throw new Error('Choose under which office it comes');
    return withLock_(function () {
      const t = table_(SHEETS.UNITS, UNIT_FIELDS);
      if (t.rows.some(function (x) { return x.name.toLowerCase() === name.toLowerCase(); })) throw new Error('This name already exists');
      let n = 0, ord = 0;
      t.rows.forEach(function (x) { n = Math.max(n, parseInt(String(x.id).replace(/\D/g, ''), 10) || 0); ord = Math.max(ord, parseFloat(x.order) || 0); });
      writeRow_(t.sh, t.sh.getLastRow() + 1, UNIT_FIELDS, { id: 'U' + (n + 1), name: name, parent: parent, kind: kind, order: ord + 1, createdAt: Date.now() });
      UNITS_ = null;
      return { units: readUnits_(), id: 'U' + (n + 1) };
    });
  },

  /** System Admin: rename, change type, or move a unit under another office. */
  editUnit: function (me, req) {
    requireSys_(me);
    const id = str_(req.id);
    return withLock_(function () {
      const t = table_(SHEETS.UNITS, UNIT_FIELDS);
      const i = indexOf_(t.rows, 'id', id);
      if (i < 0) throw new Error('Unit not found');
      const u = t.rows[i];
      const name = str_(req.name).slice(0, 80);
      if (name) {
        if (t.rows.some(function (x) { return x.id !== id && x.name.toLowerCase() === name.toLowerCase(); })) throw new Error('This name already exists');
        u.name = name;
      }
      if (req.parent !== undefined && str_(req.parent) !== u.parent) {
        if (u.kind === 'TOP') throw new Error('The top office cannot be moved');
        const p = str_(req.parent);
        if (!unitById_(p)) throw new Error('Choose under which office it comes');
        if (descendants_(id).indexOf(p) >= 0) throw new Error('A unit cannot be placed under itself');
        u.parent = p;
      }
      if ((req.kind === 'WING' || req.kind === 'BRANCH') && u.kind !== 'TOP') u.kind = req.kind;
      writeRow_(t.sh, u._row, UNIT_FIELDS, u);
      UNITS_ = null;
      return { units: readUnits_() };
    });
  },

  deleteUnit: function (me, req) {
    requireSys_(me);
    const id = str_(req.id);
    return withLock_(function () {
      const t = table_(SHEETS.UNITS, UNIT_FIELDS);
      const i = indexOf_(t.rows, 'id', id);
      if (i < 0) throw new Error('Unit not found');
      const u = t.rows[i];
      if (u.kind === 'TOP') throw new Error('The top office cannot be deleted');
      if (t.rows.some(function (x) { return x.parent === id; })) throw new Error('Move or delete the units under it first');
      const people = readUsers_().filter(function (x) { return !x.deleted && unitIds_(x).indexOf(id) >= 0; }).length;
      if (people) throw new Error(people + ' people are in this unit. Move them to another unit first.');
      const files = table_(SHEETS.DAK, DAK_FIELDS).rows.filter(function (d) { return d.status !== STATUS.COMPLETED && (d.branch === id || d.curUnit === id); }).length;
      if (files) throw new Error(files + ' files (pending or kept in record) belong to or are lying in this unit');
      t.sh.deleteRow(u._row);
      UNITS_ = null;
      return { units: readUnits_() };
    });
  },

  /** Staff statement: add a new employee, or correct name / designation / BPS / appointment / cell / remarks. No app login is created here. */
  saveStaff: function (me, req) {
    requireAdmin_(me);
    const p = req.person || {};
    const name = str_(p.name).slice(0, 80);
    if (!name) throw new Error('Please write the name');
    const bps = str_(p.bps);
    if (bps && !/^\d{1,2}$/.test(bps)) throw new Error('BPS should be a number, e.g. 14');
    const cell = str_(p.cell).slice(0, 30);
    return withLock_(function () {
      const t = table_(SHEETS.USERS, USER_FIELDS);
      const username = str_(p.username).toLowerCase();
      let o = null;
      if (username) {
        const i = indexOf_(t.rows, 'username', username);
        if (i < 0 || t.rows[i].deleted) throw new Error('Person not found');
        o = t.rows[i];
        if (!isHrEdit_(me)) {
          if (!sharesScope_(me, o)) throw new Error('This person is not in your units');
          if (o.role === 'HEAD' && o.username !== me.username) throw new Error('Only the Admin Branch can edit an officer\'s record');
        }
      } else {
        const unit = str_(p.unit);
        if (!unitById_(unit)) throw new Error('Choose the wing and branch');
        if (!isHrEdit_(me) && !inScope_(me, unit)) throw new Error('You can add people only in your own units');
        const taken = {}; t.rows.forEach(function (u) { taken[u.username] = 1; });
        o = { username: newUsername_(name, taken), role: 'STAFF', pinHash: '', active: true, deleted: false, createdAt: Date.now(), units: unit, sysAdmin: false, sr: '' };
      }
      o.name = name;
      o.designation = str_(p.designation).slice(0, 80);
      o.bps = bps;
      o.appt = APPTS.indexOf(str_(p.appt)) >= 0 ? str_(p.appt) : (str_(p.appt).slice(0, 30) || o.appt || 'Regular');
      o.cell = cell;
      o.remarks = str_(p.remarks).slice(0, 120);
      const cnic = str_(p.cnic).replace(/[^0-9]/g, '');
      if (cnic && cnic.length !== 13) throw new Error('CNIC should have 13 digits, e.g. 36502-1234567-1');
      if (str_(p.email) && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(str_(p.email))) throw new Error('E-mail does not look right');
      RECORD_KEYS.forEach(function (k) { if (k in p) o[k] = str_(p[k]).slice(0, k === 'address' ? 200 : 80); });
      if (cnic) o.cnic = cnic.slice(0, 5) + '-' + cnic.slice(5, 12) + '-' + cnic.slice(12);
      if (o.appt === 'Deputation' && !str_(o.parentDept)) throw new Error('For a deputationist, write the parent department');
      writeRow_(t.sh, o._row || t.sh.getLastRow() + 1, USER_FIELDS, o);
      if (!username) logTransfer_(me, 'JOINED', o, '', o.units, { date: p.date, orderNo: p.orderNo, remarks: p.joinNote });
      USERS_ = null;
      return publicUser_(findUser_(o.username), me);
    });
  },

  /** Admin Branch: move a person from one branch to another (wing → branch). Recorded in the Transfers sheet. */
  transfer: function (me, req) {
    if (!isHrEdit_(me)) throw new Error('Only the Admin Branch can transfer staff');
    const to = str_(req.toUnit);
    if (!unitById_(to)) throw new Error('Choose the wing and branch to transfer to');
    return withLock_(function () {
      const t = table_(SHEETS.USERS, USER_FIELDS);
      const i = indexOf_(t.rows, 'username', str_(req.username).toLowerCase());
      if (i < 0 || t.rows[i].deleted) throw new Error('Person not found');
      const u = t.rows[i];
      const list = userUnits_(u);
      const from = str_(req.fromUnit) || (list[0] && list[0].id) || '';
      if (from === to) throw new Error('The person is already in this branch');
      if (list.some(function (b) { return b.id === to; })) throw new Error(u.name + ' is already in ' + unitName_(to));
      const pending = table_(SHEETS.DAK, DAK_FIELDS).rows.filter(function (d) {
        return d.assignedTo === u.username && (d.status === STATUS.MARKED || d.status === STATUS.IN_PROGRESS || d.status === STATUS.FROZEN) && (d.curUnit || d.branch) === from;
      }).length;
      if (pending) throw new Error(u.name + ' still holds ' + pending + ' pending file(s) of ' + unitName_(from) + '. Ask him to send them on (charge handing over) first.');
      const j = list.map(function (b) { return b.id; }).indexOf(from);
      if (j >= 0) list[j] = { id: to, charge: list[j].charge };
      else list.unshift({ id: to, charge: u.role === 'HEAD' ? 'Full' : '' });
      u.units = fmtUnits_(list.slice(0, CONFIG.MAX_UNITS));
      if (u.remarks && /^Posted in /.test(u.remarks)) u.remarks = '';
      writeRow_(t.sh, u._row, USER_FIELDS, u);
      logTransfer_(me, 'TRANSFER', u, from, to, req);
      USERS_ = null;
      return { person: publicUser_(findUser_(u.username), me), transfers: readTransfers_(200) };
    });
  },

  /** How much a person did and what: files received, completed (on time / late), sent on, pending now — for a period. */
  personReport: function (me, req) {
    const u = findUser_(req.username);
    if (!u) throw new Error('Person not found');
    if (!(isHrView_(me) || u.username === me.username || (isAdmin_(me) && sharesScope_(me, u)))) throw new Error('You cannot see this person\'s work');
    return personReport_(me, u, pkParse_(req.from) || 0, pkParse_(req.to) ? pkParse_(req.to) + 864e5 : Date.now() + 6e4);
  },

  /** Everyone's work at a glance for a period (Chairperson / Secretary / Admin: all people; an officer: people of his units). */
  workSummary: function (me, req) {
    const hr = isHrView_(me);
    if (!hr && !isAdmin_(me)) throw new Error('Not allowed for your role');
    const from = pkParse_(req.from) || 0, to = pkParse_(req.to) ? pkParse_(req.to) + 864e5 : Date.now() + 6e4, now = Date.now();
    const map = {};
    readUsers_().forEach(function (u) {
      if (!u.deleted && u.pinHash && (hr || sharesScope_(me, u))) map[u.username] = { username: u.username, received: 0, completed: 0, late: 0, sentOn: 0, pending: 0, overdue: 0 };
    });
    table_(SHEETS.LOG, LOG_FIELDS).rows.forEach(function (l) {
      if (!(l.time >= from && l.time < to)) return;
      if (MOVE_RE_.test(l.action) && map[l.toUser]) map[l.toUser].received++;
      const m = map[l.user];
      if (!m) return;
      if (/^Completed/.test(l.action)) { m.completed++; if (/late/.test(l.action)) m.late++; }
      else if (MOVE_RE_.test(l.action) && l.toUser && l.toUser !== l.user) m.sentOn++;
    });
    table_(SHEETS.DAK, DAK_FIELDS).rows.forEach(function (d) {
      const m = map[d.assignedTo];
      if (!m || !(d.status === STATUS.MARKED || d.status === STATUS.IN_PROGRESS || d.status === STATUS.FROZEN || d.status === STATUS.RECEIVED)) return;
      m.pending++;
      if ((d.status === STATUS.MARKED || d.status === STATUS.IN_PROGRESS) && d.deadline && d.deadline < now) m.overdue++;
    });
    return { from: from, to: Math.min(to, now), rows: Object.keys(map).map(function (k) { return map[k]; }) };
  },

  changePin: function (me, req) {
    if (me.pinHash !== hashPin_(me.username, str_(req.oldPin))) throw new Error('Current PIN is wrong');
    const np = str_(req.newPin);
    if (!/^\d{4,8}$/.test(np)) throw new Error('New PIN must be 4–8 digits');
    return withLock_(function () {
      const t = table_(SHEETS.USERS, USER_FIELDS);
      const o = t.rows[indexOf_(t.rows, 'username', me.username)];
      o.pinHash = hashPin_(o.username, np);
      writeRow_(t.sh, o._row, USER_FIELDS, o);
      return { token: makeToken_(o) };
    });
  }
};


/* ============================ STAFF: TRANSFERS & WORK REPORT ============================ */

function logTransfer_(me, kind, u, from, to, req) {
  req = req || {};
  const sh = sheet_(SHEETS.TR);
  writeRow_(sh, sh.getLastRow() + 1, TR_FIELDS, {
    time: Date.now(), kind: kind, username: u.username, name: u.name, designation: u.designation, from: from, to: to,
    effective: str_(req.date) || pkDate_(Date.now()), orderNo: str_(req.orderNo).slice(0, 60), remarks: str_(req.remarks || req.reason).slice(0, 160), by: me.username
  });
}
function readTransfers_(limit) {
  const rows = table_(SHEETS.TR, TR_FIELDS).rows;
  return rows.slice(Math.max(0, rows.length - limit)).reverse().map(function (r) {
    return { time: r.time, kind: r.kind, username: r.username, name: r.name, designation: r.designation, from: r.from, to: r.to, effective: r.effective, orderNo: r.orderNo, remarks: r.remarks, by: r.by };
  });
}

const MOVE_RE_ = /^(Marked|Sent|Re-marked|Reopened|Received|Returned)/;
function personReport_(me, u, from, to) {
  const now = Date.now(), who = u.username;
  const files = {}; table_(SHEETS.DAK, DAK_FIELDS).rows.forEach(function (d) { files[d.id] = d; });
  const logs = table_(SHEETS.LOG, LOG_FIELDS).rows.slice().sort(function (a, b) { return a.time - b.time; });
  const byFile = {};
  logs.forEach(function (l) { (byFile[l.dakId] = byFile[l.dakId] || []).push(l); });
  const inRange = function (t) { return t >= from && t < to; };
  const st = { received: 0, completed: 0, completedLate: 0, sentOn: 0, notes: 0, stored: 0, opened: 0, frozen: 0, handled: 0, onTime: 0, late: 0, totalMs: 0 };
  // every time a file reached this person: when did it leave him, and was that within the time allowed?
  Object.keys(byFile).forEach(function (id) {
    const L = byFile[id];
    L.forEach(function (l, k) {
      if (!(MOVE_RE_.test(l.action) && l.toUser === who && inRange(l.time))) return;
      st.received++;
      let left = null;
      for (let n = k + 1; n < L.length; n++) {
        const x = L[n];
        if ((MOVE_RE_.test(x.action) && x.toUser !== who) || /^Completed|^Stored in record/.test(x.action)) { left = x.time; break; }
        if (MOVE_RE_.test(x.action) && x.toUser === who) break;    // marked to him again: counted separately
      }
      if (left) {
        st.handled++; st.totalMs += left - l.time;
        if (l.due && left > l.due) st.late++; else st.onTime++;
      }
    });
  });
  const act = [];
  logs.forEach(function (l) {
    if (!inRange(l.time)) return;
    const mine = l.user === who;
    if (mine) {
      if (/^Completed/.test(l.action)) { st.completed++; if (/late/.test(l.action)) st.completedLate++; }
      else if (MOVE_RE_.test(l.action) && l.toUser && l.toUser !== who) st.sentOn++;
      else if (l.action === 'Note') st.notes++;
      else if (l.action === 'Stored in record') st.stored++;
      else if (l.action === 'File opened') st.opened++;
      else if (/^Frozen/.test(l.action)) st.frozen++;
    }
    if (mine || l.toUser === who) {
      const d = files[l.dakId];
      if (d && canSee_(me, d)) act.push({ time: l.time, action: l.action, note: l.note, by: l.user, toUser: l.toUser, toUnit: l.toUnit, dakId: l.dakId, diaryNo: d.diaryNo, subject: d.subject });
    }
  });
  const pending = Object.keys(files).map(function (k) { return files[k]; }).filter(function (d) {
    return d.assignedTo === who && (d.status === STATUS.MARKED || d.status === STATUS.IN_PROGRESS || d.status === STATUS.FROZEN || d.status === STATUS.RECEIVED);
  });
  st.pendingNow = pending.length;
  st.overdueNow = pending.filter(function (d) { return (d.status === STATUS.MARKED || d.status === STATUS.IN_PROGRESS) && d.deadline && d.deadline < now; }).length;
  st.avgMs = st.handled ? Math.round(st.totalMs / st.handled) : 0;
  return {
    username: who, from: from, to: Math.min(to, now), stats: st,
    pending: pending.filter(function (d) { return canSee_(me, d); }).map(function (d) { return { id: d.id, diaryNo: d.diaryNo, subject: d.subject, status: d.status, deadline: d.deadline, assignedAt: d.assignedAt, curUnit: d.curUnit }; }),
    activity: act.reverse().slice(0, 150)
  };
}


/* ============================ FILE HELPERS ============================ */

function applyAssign_(d, me, req, now, label, extraNote) {
  const to = findUser_(req.assignTo);
  if (!to || !to.active || to.deleted) throw new Error('Please select a person');
  const toUnits = unitIds_(to);
  let unit = str_(req.unit);
  if (toUnits.indexOf(unit) < 0) unit = toUnits[0] || d.curUnit || d.branch;
  const prev = d.assignedTo;
  d.assignedTo = to.username;
  d.assignedBy = me.username;
  d.assignedAt = now;
  d.deadline = deadlineFrom_(now, req.days, req.deadlineDate);
  d.status = STATUS.MARKED;
  d.startedAt = null;
  d.completedAt = null;
  d.curUnit = unit;
  d.rcvdAt = label && /^Received/.test(label) ? now : null;      // until the other side scans "File received", the file is on its way
  const remarks = str_(req.instructions);
  if (remarks) d.instructions = remarks;
  if (PRIORITIES.indexOf(req.priority) >= 0) d.priority = req.priority;
  addHandled_(d, me.username);
  addHandled_(d, to.username);
  const action = label || (!prev ? 'Marked' : prev === to.username ? 'Marked again' : prev === me.username ? 'Sent' : 'Re-marked');
  log_(d.id, me, action, 'To ' + to.name + ' (' + unitName_(unit) + ')  ·  due ' + pkStr_(d.deadline) + (remarks ? '  ·  ' + remarks : '') + (extraNote ? '  ·  ' + extraNote : ''),
    { toUser: to.username, toUnit: unit, due: d.deadline, remark: remarks || extraNote || '' });
}

function applyFreeze_(d, me, req, now) {
  if (str_(req.assignTo)) {
    const to = findUser_(req.assignTo);
    if (!to || !to.active || to.deleted) throw new Error('Please select a person');
    const toUnits = unitIds_(to);
    d.assignedTo = to.username; d.assignedBy = me.username; d.assignedAt = now;
    d.curUnit = toUnits.indexOf(str_(req.unit)) >= 0 ? str_(req.unit) : (toUnits[0] || d.curUnit);
    addHandled_(d, to.username);
  }
  addHandled_(d, me.username);
  d.status = STATUS.FROZEN;
  d.deadline = null;
  d.completedAt = null;
  if (str_(req.instructions)) d.instructions = str_(req.instructions);
  const note = str_(req.note || req.instructions);
  log_(d.id, me, 'Frozen for later discussion', (d.assignedTo ? 'File with ' + (findUser_(d.assignedTo) || {}).name : '') + (note ? '  ·  ' + note : ''),
    { toUser: d.assignedTo, toUnit: d.curUnit });
}

/** File number: branch code / serial / date — e.g. ADMIN/12/20-11-2026 (unique: the serial never repeats). */
function fileNo_(unitId, id, ymd) {
  const m = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return unitCode_(unitId) + '/' + id + '/' + (m ? m[3] + '-' + m[2] + '-' + m[1] : ymd);
}
function unitCode_(unitId) {
  const name = unitName_(unitId).replace(/\(.*?\)/g, ' ').replace(/[^A-Za-z ]/g, ' ');
  const skip = ['branch', 'section', 'cell', 'office', 'of', 'and', 'the', 'wing'];
  const w = name.split(/\s+/).filter(function (x) { return x && skip.indexOf(x.toLowerCase()) < 0; });
  if (!w.length) return 'FTS';
  if (w.length === 1) return w[0].toUpperCase().slice(0, w[0].length <= 12 ? 12 : 6);
  return w.map(function (x) { return x.charAt(0); }).join('').toUpperCase();
}

function listDocs_(dakId) {
  return table_(SHEETS.DOCS, DOC_FIELDS).rows.filter(function (r) { return String(r.dakId) === String(dakId); })
    .map(function (r) { return { id: r.id, type: r.type, title: r.title, docDate: r.docDate, fileName: r.fileName, by: r.by, at: r.at }; });
}

function newQr_() {
  const u = Utilities.getUuid().replace(/-/g, '');
  let s = '';
  for (let i = 0; i < 6; i++) s += QR_ALPHA.charAt(parseInt(u.substr(i * 2, 2), 16) % QR_ALPHA.length);
  return s;
}
function checkQr_(d, code) {
  if (!d.qr || str_(code).toUpperCase().replace(/[^A-Z0-9]/g, '') !== d.qr) throw new Error('This QR code does not match the file. Scan again, or type the code printed under the QR.');
}
/** Who sent the file to its present holder, and from which office (where that person had it). */
function returnTarget_(d) {
  const L = table_(SHEETS.LOG, LOG_FIELDS).rows.filter(function (l) { return String(l.dakId) === String(d.id); }).sort(function (a, b) { return a.time - b.time; });
  let k = -1;
  for (let i = L.length - 1; i >= 0; i--) if (MOVE_RE_.test(L[i].action) && L[i].toUser === d.assignedTo) { k = i; break; }
  const sender = k >= 0 ? L[k].user : (d.assignedBy || d.createdBy);
  if (!sender) return { user: '', unit: '' };
  let unit = '';
  for (let j = k - 1; j >= 0; j--) if ((MOVE_RE_.test(L[j].action) && L[j].toUser === sender) || (L[j].action === 'File opened' && L[j].user === sender)) { unit = L[j].toUnit; break; }
  const su = findUser_(sender);
  if (!unit || (su && unitIds_(su).indexOf(unit) < 0)) unit = su ? (unitIds_(su).indexOf(d.branch) >= 0 ? d.branch : unitIds_(su)[0]) : d.branch;
  return { user: sender, unit: unit || d.branch, name: su ? su.name : sender };
}

/** Where "Not ours — return" sends a file: if it reached the person (or office) it was meant for, back to whoever sent it;
    if it reached someone else by hand, back to the person who holds it in FTS. */
function backFor_(d, me) {
  const cur = d.curUnit || d.branch;
  if (d.assignedTo && d.assignedTo !== me.username && unitIds_(me).indexOf(cur) < 0) {
    const h = findUser_(d.assignedTo);
    return { user: d.assignedTo, unit: cur, name: h ? h.name : d.assignedTo };
  }
  return returnTarget_(d);
}

function isClosed_(d) { return d.status === STATUS.COMPLETED || d.status === STATUS.STORED; }
function closedAt_(d) { return (d.status === STATUS.STORED ? d.storedAt : d.completedAt) || 0; }

function addHandled_(d, username) {
  const list = String(d.handledBy || '').split(',').filter(String);
  if (list.indexOf(username) < 0) list.push(username);
  d.handledBy = list.join(',');
}

function updateDak_(id, mutate) {
  return withLock_(function () {
    const t = table_(SHEETS.DAK, DAK_FIELDS);
    const idx = indexOf_(t.rows, 'id', String(id));
    if (idx < 0) throw new Error('File not found');
    const d = t.rows[idx];
    const now = Date.now();
    mutate(d, now);
    d.updatedAt = now;
    writeRow_(t.sh, d._row, DAK_FIELDS, d);
    return clientDak_(d);
  });
}

function getDak_(id) {
  const rows = table_(SHEETS.DAK, DAK_FIELDS).rows;
  const i = indexOf_(rows, 'id', String(id));
  if (i < 0) throw new Error('File not found');
  return rows[i];
}

function clientDak_(d) {
  const o = {};
  DAK_FIELDS.forEach(function (f) { if (f[0] !== 'fileId') o[f[0]] = d[f[0]]; });
  o.hasFile = !!d.fileId;
  return o;
}

function nextId_() {
  const p = PropertiesService.getScriptProperties();
  let n = parseInt(p.getProperty('SEQ') || '0', 10);
  table_(SHEETS.DAK, DAK_FIELDS).rows.forEach(function (r) { n = Math.max(n, parseInt(r.id, 10) || 0); });
  n += 1;
  p.setProperty('SEQ', String(n));
  return String(n);
}

/* ---------- deadlines & office holidays ---------- */

/** N working days after `fromMs` (Sundays + office holidays skipped), at office closing time, Pakistan time. */
function deadlineFrom_(fromMs, days, dateStr) {
  const OFF = CONFIG.PK_OFFSET_HOURS * 36e5;
  let d;
  if (str_(dateStr)) {
    const t = pkParse_(dateStr);
    if (!t) throw new Error('Invalid date');
    d = new Date(t + OFF);
  } else {
    const n = (days === 0 || days === '0') ? 0 : (parseInt(days, 10) || 1);
    d = new Date(addWorkingDays_(fromMs, n) + OFF);
  }
  d.setUTCHours(CONFIG.OFFICE_CLOSE_HOUR, 0, 0, 0);
  return d.getTime() - OFF;
}

/** Move forward k working days, keeping the time of day. */
function addWorkingDays_(ms, k) {
  const OFF = CONFIG.PK_OFFSET_HOURS * 36e5;
  const d = new Date(ms + OFF);
  let added = 0;
  while (added < k) {
    d.setUTCDate(d.getUTCDate() + 1);
    if (!isOffDay_(d)) added++;
  }
  return d.getTime() - OFF;
}

/* ---------- office holidays ---------- */

let HOL_ = null;
/** { 'yyyy-MM-dd': 'Holiday name' } for every holiday date. */
function holidayMap_() {
  if (!HOL_) {
    HOL_ = {};
    table_(SHEETS.HOL, HOL_FIELDS).rows.forEach(function (h) {
      expandDates_(h.from, h.to || h.from).forEach(function (ds) { HOL_[ds] = h.title; });
    });
  }
  return HOL_;
}

function readHolidays_() {
  return table_(SHEETS.HOL, HOL_FIELDS).rows
    .map(function (h) { return { id: h.id, from: h.from, to: h.to || h.from, title: h.title }; })
    .sort(function (a, b) { return a.from < b.from ? -1 : 1; });
}

/** d is a "shifted" Date (Pakistan wall-clock in its UTC fields). */
function isOffDay_(d) {
  return CONFIG.WEEKEND_DAYS.indexOf(d.getUTCDay()) >= 0 || !!holidayMap_()[ymd_(d)];
}
function ymd_(d) { return d.getUTCFullYear() + '-' + p2_(d.getUTCMonth() + 1) + '-' + p2_(d.getUTCDate()); }

function expandDates_(from, to) {
  const out = [];
  const a = pkParse_(from), b = pkParse_(to);
  if (!a || !b) return out;
  const OFF = CONFIG.PK_OFFSET_HOURS * 36e5;
  const d = new Date(a + OFF), end = new Date(b + OFF);
  while (d <= end && out.length < 400) { out.push(ymd_(d)); d.setUTCDate(d.getUTCDate() + 1); }
  return out;
}

/**
 * A holiday was added: every pending dak whose allotted time includes those working days
 * gets its deadline pushed forward by the same number of working days.
 */
function shiftForHoliday_(me, newDates, title) {
  if (!newDates.length) return 0;
  const t = table_(SHEETS.DAK, DAK_FIELDS);
  const now = Date.now();
  let moved = 0;
  t.rows.forEach(function (d) {
    if ((d.status !== STATUS.MARKED && d.status !== STATUS.IN_PROGRESS) || !d.deadline || !d.assignedAt) return;
    const a = pkDate_(d.assignedAt), z = pkDate_(d.deadline);
    const k = newDates.filter(function (x) { return (x > a && x <= z) || x === z; }).length;
    if (!k) return;
    const old = d.deadline;
    d.deadline = addWorkingDays_(d.deadline, k);
    d.updatedAt = now;
    writeRow_(t.sh, d._row, DAK_FIELDS, d);
    log_(d.id, me, 'Deadline moved (holiday)', title + '  ·  ' + pkStr_(old) + '  →  ' + pkStr_(d.deadline), { due: d.deadline });
    moved++;
  });
  return moved;
}

function saveFile_(file, id) {
  if (!file || !file.data) throw new Error('No file received');
  const bytes = Utilities.base64Decode(file.data);
  if (bytes.length > CONFIG.MAX_FILE_MB * 1048576) throw new Error('File is larger than ' + CONFIG.MAX_FILE_MB + ' MB');
  const name = str_(file.name) || 'letter';
  const blob = Utilities.newBlob(bytes, file.mime || 'application/octet-stream', 'Dak-' + id + '-' + Date.now() + '-' + name);
  const f = DriveApp.getFolderById(prop_('FOLDER_ID')).createFile(blob);
  return { id: f.getId(), name: name };
}

function log_(dakId, me, action, note, extra) {
  const sh = sheet_(SHEETS.LOG), x = extra || {};
  writeRow_(sh, sh.getLastRow() + 1, LOG_FIELDS, {
    time: Date.now(), dakId: dakId, user: me.username, action: action, note: note || '',
    toUser: x.toUser || '', toUnit: x.toUnit || '', due: x.due || null, remark: x.remark || ''
  });
}


/* ============================ USERS & AUTH ============================ */

function login_(req) {
  const username = str_(req.username).toLowerCase();
  const cache = CacheService.getScriptCache();
  const key = 'fail_' + username;
  const fails = parseInt(cache.get(key) || '0', 10);
  if (fails >= 5) throw new Error('Too many wrong attempts. Try again after 10 minutes.');
  const all = readUsers_();
  if (!all.some(function (x) { return !x.deleted; })) throw new Error('No users found. In Apps Script, run "setup" (or "resetAllPins") once.');
  const i = indexOf_(all, 'username', username);
  const u = i < 0 ? null : all[i];
  if (u && !u.deleted && u.active && !u.pinHash) throw new Error('No app login for this person yet. Ask the Admin Branch / your officer to set a PIN.');
  if (!u || u.deleted || !u.active || u.pinHash !== hashPin_(username, str_(req.pin))) {
    cache.put(key, String(fails + 1), 600);
    throw new Error('Wrong username or PIN');
  }
  cache.remove(key);
  return { token: makeToken_(u), user: publicUser_(u) };
}

function auth_(token) {
  const parts = String(token || '').split('.');
  if (parts.length !== 2) throw new Error('AUTH');
  let payload;
  try { payload = Utilities.newBlob(Utilities.base64DecodeWebSafe(parts[0])).getDataAsString(); }
  catch (e) { throw new Error('AUTH'); }
  if (sign_(payload) !== parts[1]) throw new Error('AUTH');
  const p = payload.split('|');
  if (Date.now() > Number(p[1])) throw new Error('AUTH');
  const u = findUser_(p[0]);
  if (!u || u.deleted || !u.active || !u.pinHash || u.pinHash.slice(0, 12) !== p[2]) throw new Error('AUTH');
  return u;
}

function makeToken_(u) {
  const payload = [u.username, Date.now() + CONFIG.TOKEN_DAYS * 864e5, u.pinHash.slice(0, 12)].join('|');
  return Utilities.base64EncodeWebSafe(payload) + '.' + sign_(payload);
}

function sign_(s) {
  return Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(s, prop_('SECRET')));
}

function hashPin_(username, pin) {
  const bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,
    prop_('SECRET') + '|' + String(username).toLowerCase() + '|' + pin, Utilities.Charset.UTF_8);
  return bytes.map(function (b) { return ('0' + (b & 0xff).toString(16)).slice(-2); }).join('');
}

let USERS_ = null;
function readUsers_() { if (!USERS_) USERS_ = table_(SHEETS.USERS, USER_FIELDS).rows; return USERS_; }

function findUser_(username) {
  const rows = readUsers_();
  const i = indexOf_(rows, 'username', String(username || '').toLowerCase());
  return i < 0 ? null : rows[i];
}

function publicUser_(u, me) {
  const o = {
    username: u.username, name: u.name, designation: u.designation, role: u.role, login: !!u.pinHash,
    active: u.active, deleted: !!u.deleted, sysAdmin: !!u.sysAdmin, units: userUnits_(u), bps: u.bps, appt: u.appt, sr: u.sr
  };
  if (!me || me.username === u.username || isHrView_(me) || (isAdmin_(me) && sharesScope_(me, u))) { o.cell = u.cell; o.remarks = u.remarks; }
  if (me && (me.username === u.username || isHrView_(me))) RECORD_KEYS.forEach(function (k) { if (u[k]) o[k] = u[k]; });   // full record: Chairperson, Secretary, Admin Branch, and the person himself
  return o;
}
/** Chairperson, Secretary, Admin Branch (and the System Admin) see the whole staff statement. */
function isHrView_(me) {
  return !!me.sysAdmin || unitIds_(me).some(function (id) { return CONFIG.HR_VIEW_UNITS.indexOf(id) >= 0; });
}
/** Admin Branch officer / Dak Incharge (and the System Admin) add, transfer and remove employees. */
function isHrEdit_(me) {
  return !!me.sysAdmin || (isAdmin_(me) && unitIds_(me).some(function (id) { return CONFIG.HR_EDIT_UNITS.indexOf(id) >= 0; }));
}
/** Which people a user receives: everyone with an app login (to send files to), plus staff of his own units; the full list for HR viewers. */
function visiblePeople_(me) {
  const hr = isHrView_(me);
  return readUsers_().filter(function (u) {
    if (u.deleted) return !!u.pinHash || hr;              // old names still show in file history
    return hr || !!u.pinHash || u.username === me.username || (isAdmin_(me) && sharesScope_(me, u));
  });
}

function normRole_(r) {
  r = str_(r).toUpperCase();
  r = ROLE_ALIASES[r] || r;
  return ROLES.indexOf(r) >= 0 ? r : '';
}
function isAdmin_(me) { return me.role === 'HEAD' || me.role === 'DAK_INCHARGE'; }
function inScope_(me, unitId) { return scopeIds_(me).indexOf(unitId) >= 0; }
function sharesScope_(me, u) { return unitIds_(u).some(function (b) { return inScope_(me, b); }); }
function handled_(d, me) { return (',' + (d.handledBy || '') + ',').indexOf(',' + me.username + ',') >= 0; }
function canManage_(me, d) { return isAdmin_(me) && (inScope_(me, d.curUnit || d.branch) || inScope_(me, d.branch)); }
function canSee_(me, d) { return d.assignedTo === me.username || handled_(d, me) || canManage_(me, d); }
function requireAdmin_(me) { if (!isAdmin_(me)) throw new Error('Not allowed for your role'); }
function requireSys_(me) { if (!me.sysAdmin) throw new Error('Only the System Admin can do this'); }
function requireManage_(me, d) { if (!canManage_(me, d)) throw new Error('This file is not in a unit under your charge'); }
function requireSee_(me, d) { if (!canSee_(me, d)) throw new Error('You do not have access to this file'); }


/* ============================ ORGANISATION (UNITS) ============================ */

let UNITS_ = null;
/** All units [{id, name, parent, kind, order}], in display order. */
function readUnits_() {
  if (!UNITS_) {
    UNITS_ = table_(SHEETS.UNITS, UNIT_FIELDS).rows.map(function (u) {
      return { id: u.id, name: u.name, parent: u.parent, kind: KINDS.indexOf(u.kind) >= 0 ? u.kind : 'BRANCH', order: parseFloat(u.order) || 0 };
    }).sort(function (a, b) { return a.order - b.order; });
  }
  return UNITS_;
}
function unitById_(id) { return readUnits_().filter(function (u) { return u.id === id; })[0] || null; }
function unitName_(id) { const u = unitById_(id); return u ? u.name : (id || ''); }
/** The unit itself and everything below it. */
function descendants_(id) {
  const out = [id], all = readUnits_();
  for (let i = 0; i < out.length; i++) all.forEach(function (u) { if (u.parent === out[i] && out.indexOf(u.id) < 0) out.push(u.id); });
  return out;
}
/** "U5:Full,U6:Additional" → [{id:'U5', charge:'Full'}, …]  (unknown units are dropped). */
function userUnits_(u) {
  const valid = readUnits_().map(function (x) { return x.id; });
  const role = normRole_(u.role);
  const list = [];
  String(u.units || '').split(',').forEach(function (part) {
    const bits = part.split(':'), id = str_(bits[0]);
    if (!id || valid.indexOf(id) < 0 || list.some(function (x) { return x.id === id; })) return;
    const ch = str_(bits[1]);
    list.push({ id: id, charge: role === 'HEAD' ? (CHARGES.indexOf(ch) >= 0 ? ch : 'Additional') : '' });
  });
  return list.slice(0, CONFIG.MAX_UNITS);
}
function unitIds_(u) { return userUnits_(u).map(function (b) { return b.id; }); }
function fmtUnits_(list) { return list.map(function (b) { return b.id + (b.charge ? ':' + b.charge : ''); }).join(','); }
/** Units whose files this person oversees: a Head sees his units and everything under them; a Dak Incharge only his units. */
function scopeIds_(me) {
  if (me._scope) return me._scope;
  let out = [];
  if (isAdmin_(me)) {
    unitIds_(me).forEach(function (id) {
      (me.role === 'HEAD' ? descendants_(id) : [id]).forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); });
    });
  }
  me._scope = out;
  return out;
}

function editorOnly_() {
  if (!Session.getActiveUser().getEmail()) throw new Error('Run this from the Apps Script editor.');
}

function digestEmail_() {
  return PropertiesService.getScriptProperties().getProperty('HEAD_EMAIL') || Session.getEffectiveUser().getEmail();
}


/* ============================ SHEET HELPERS ============================ */

let SS_ = null;
const SHEET_OK_ = {};
function resetCaches_() { USERS_ = null; UNITS_ = null; HOL_ = null; }
function sheet_(name) {
  if (!SS_) {
    const id = prop_('SHEET_ID');
    SS_ = SpreadsheetApp.openById(id);
  }
  let sh = SS_.getSheetByName(name);
  const fields = SHEET_FIELDS[name];
  if (!sh && fields && name !== SHEETS.USERS && name !== SHEETS.DAK && name !== SHEETS.UNITS) sh = ensureSheet_(SS_, name, fields);   // added in later versions
  if (!sh) throw new Error('Sheet "' + name + '" missing — run setup()');
  if (fields && !SHEET_OK_[name]) {                       // newer version added columns → write the new headings
    if (sh.getLastColumn() < fields.length) ensureSheet_(SS_, name, fields);
    SHEET_OK_[name] = true;
  }
  return sh;
}

function prop_(key) {
  const v = PropertiesService.getScriptProperties().getProperty(key);
  if (!v) throw new Error('App is not set up yet — run setup() in the Apps Script editor');
  return v;
}

function ensureSheet_(ss, name, fields) {
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  const head = sh.getRange(1, 1, 1, fields.length);
  head.setValues([fields.map(function (f) { return f[1]; })]).setFontWeight('bold').setBackground('#e8f1ec');
  sh.setFrozenRows(1);
  sh.getRange(1, 1, sh.getMaxRows(), fields.length).setNumberFormat('@');
  return sh;
}

function table_(name, fields) {
  const sh = sheet_(name);
  const n = sh.getLastRow();
  const rows = [];
  if (n >= 2) {
    sh.getRange(2, 1, n - 1, fields.length).getValues().forEach(function (r, i) {
      if (String(r[0]).trim() === '') return;          // skip blank rows
      const o = rowToObj_(r, fields);
      o._row = i + 2;                                   // real sheet row number
      rows.push(o);
    });
  }
  return { sh: sh, rows: rows };
}

function rowToObj_(r, fields) {
  const o = {};
  fields.forEach(function (f, i) {
    const k = f[0];
    let v = r[i];
    if (TS_KEYS[k]) v = pkParse_(v);
    else if (k === 'active') v = !/^(false|no|0)$/i.test(String(v).trim());
    else if (k === 'deleted' || k === 'sysAdmin') v = /^(true|yes|1)$/i.test(String(v).trim());
    else if (v instanceof Date) v = pkDate_(v.getTime());
    else v = String(v == null ? '' : v).trim();
    if (k === 'username') v = v.toLowerCase();
    if (k === 'role' && fields === USER_FIELDS) v = normRole_(v) || 'STAFF';
    o[k] = v;
  });
  return o;
}

function rowVals_(fields, o) {
  return fields.map(function (f) {
    const v = o[f[0]];
    if (TS_KEYS[f[0]]) return v ? pkStr_(v) : '';
    if (f[0] === 'active') return v === false ? 'FALSE' : 'TRUE';
    if (f[0] === 'deleted' || f[0] === 'sysAdmin') return v ? 'TRUE' : '';
    return safe_(v);
  });
}

/** Many new rows in one go (much faster than one by one). */
function writeRows_(sh, rowNum, fields, list) {
  if (!list.length) return;
  const last = rowNum + list.length - 1;
  if (last > sh.getMaxRows()) sh.insertRowsAfter(sh.getMaxRows(), Math.max(500, last - sh.getMaxRows()));
  const range = sh.getRange(rowNum, 1, list.length, fields.length);
  range.setNumberFormat('@');
  range.setValues(list.map(function (o) { return rowVals_(fields, o); }));
  if (sh.getName && sh.getName() === SHEETS.USERS) USERS_ = null;
}

function writeRow_(sh, rowNum, fields, o) {
  const row = rowVals_(fields, o);
  if (sh.getName && sh.getName() === SHEETS.USERS) USERS_ = null;
  if (rowNum > sh.getMaxRows()) sh.insertRowsAfter(sh.getMaxRows(), Math.max(500, rowNum - sh.getMaxRows()));
  const range = sh.getRange(rowNum, 1, 1, fields.length);
  range.setNumberFormat('@');
  range.setValues([row]);
}

function indexOf_(rows, key, val) {
  for (let i = 0; i < rows.length; i++) if (String(rows[i][key]) === String(val)) return i;
  return -1;
}

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const out = fn();
    SpreadsheetApp.flush();
    return out;
  } finally {
    lock.releaseLock();
  }
}


/* ============================ SMALL UTILITIES ============================ */

function str_(v) { return v == null ? '' : String(v).trim(); }
function safe_(v) { return str_(v).replace(/^([=+@])/, ' $1'); }   // never let text become a formula
function p2_(n) { return (n < 10 ? '0' : '') + n; }

/** ms → "yyyy-MM-dd HH:mm" in Pakistan time (readable in the Sheet). */
function pkStr_(ms) {
