<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FTS BISE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FTS — BISE Sahiwal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="config.js"></script>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14201b;--mut:#5b6b63;--line:#e2e8e4;--field:#cfd8d3;
--pri:#0b5d3b;--pri-l:#e6f2ec;
--late:#c4320a;--late-bg:#fdeee9;--today:#b54708;--today-bg:#fef3e2;--new:#475467;--new-bg:#eef1f4;
--open:#1d5fbf;--open-bg:#e9f0fc;--done:#067647;--done-bg:#e6f5ed;
--r:14px;--sh:0 1px 2px rgba(16,24,20,.06),0 1px 3px rgba(16,24,20,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic",sans-serif}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--mut)}.sm{font-size:13px}.center{text-align:center}

/* header + tabs */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--pri);color:#fff}
.logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:16px}.brand small{opacity:.82;font-size:12px}
.demo-tag{font-size:10px;letter-spacing:.06em;background:#ffd166;color:#4a3500;padding:1px 6px;border-radius:5px;vertical-align:2px;margin-left:4px}
.icon{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:inherit;display:grid;place-items:center}
.icon:active{background:rgba(255,255,255,.16)}
.view{max-width:760px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:150px;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mut);position:relative}
.tabs button.on{color:var(--pri);font-weight:700}
.tabs .fab{width:42px;height:42px;margin-top:-20px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(11,93,59,.35)}
.badge{position:absolute;top:3px;left:calc(50% + 5px);background:var(--late);color:#fff;font-size:10.5px;font-style:normal;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* dashboard */
.hello h2{margin:2px 0 0;font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.tile{border:0;text-align:left;background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:1px;border-left:4px solid var(--c)}
.tile b{font-size:28px;line-height:1.1;color:var(--c)}
.tile span{font-weight:700}.tile small{color:var(--mut);font-size:12px}
.tile.big{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.tile.big b{font-size:40px;grid-row:1/3}
.t-late{--c:var(--late)}.t-today{--c:var(--today)}.t-new{--c:var(--new)}.t-open{--c:var(--open)}.t-done{--c:var(--done)}
.sec-h{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 2px 8px;font-weight:700}
.sec-h.late{color:var(--late)}
.allclear{background:var(--done-bg);color:var(--done);padding:12px 14px;border-radius:12px;display:flex;gap:8px;align-items:center;font-weight:600;margin-top:16px}
.more{display:block;width:100%;border:0;background:none;color:var(--pri);font-weight:700;padding:6px}

/* dak cards */
.card{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:12px 14px 12px 17px;margin:0 0 10px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.card:active{transform:scale(.995)}
.c-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dno{font-weight:700}
.pill{margin-left:auto;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--bgc);color:var(--c);white-space:nowrap}
.subj{font-weight:650;font-size:15.5px;margin:4px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--mut)}
.due{font-size:12.5px;font-weight:700;color:var(--c);margin-top:4px}
.s-late{--c:var(--late);--bgc:var(--late-bg)}.s-today{--c:var(--today);--bgc:var(--today-bg)}.s-new{--c:var(--new);--bgc:var(--new-bg)}
.s-open{--c:var(--open);--bgc:var(--open-bg)}.s-done{--c:var(--done);--bgc:var(--done-bg)}
.prio{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:4px}
.p-urgent{background:#fff1e0;color:#b54708}.p-immediate{background:#fde8e8;color:#b42318}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.count{margin:0 2px 8px}

/* officer table */
.tbl{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tr{display:grid;grid-template-columns:1fr 54px 60px 62px;align-items:center;gap:4px;width:100%;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.tr:first-child{border-top:0}
.tr.th{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:700;cursor:default;padding-top:8px;padding-bottom:8px;background:#fafcfb}
.tr .nm b{display:block;font-size:14px}.tr .nm small{color:var(--mut);font-size:12px}
.num{text-align:center;font-weight:700}.num.red{color:var(--late)}.num small{display:block;font-weight:500;color:var(--mut);font-size:11px}

/* lists, filters */
.tools{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--field);border-radius:12px;padding:0 10px;color:var(--mut);min-width:0}
.search input{border:0!important;outline:0!important;margin:0!important;padding:10px 0!important;background:transparent!important;min-width:0}
.tools select{width:auto!important;max-width:44%;margin:0!important}
.chips{display:flex;gap:6px;margin:0 0 12px}
.chips.scroll{overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.chip{border:1px solid var(--field);background:#fff;border-radius:20px;padding:7px 12px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip em{font-style:normal;opacity:.7;margin-left:2px}

/* forms */
.form h2{margin:4px 0 14px;font-size:20px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 12px}
input:not([type=radio]):not([type=checkbox]):not([type=file]),select,textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--field);border-radius:10px;background:#fff;font-size:16px;color:var(--ink);font-weight:400;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#5b6b63 50%),linear-gradient(135deg,#5b6b63 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
input[readonly]{background:#f1f4f2}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>label{min-width:0}input[type=date]{min-width:0;max-width:100%}
.lbl{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 6px}
.seg{display:flex;background:#e6ece8;border-radius:11px;padding:3px;margin-bottom:14px}
.seg label{flex:1;margin:0;text-align:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 4px;border-radius:8px;font-size:14px;color:var(--ink);font-weight:500}
.seg input:checked+span{background:#fff;box-shadow:var(--sh);font-weight:700;color:var(--pri)}
.filebox{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #b4c3bb;border-radius:12px;padding:14px;background:#fff;color:var(--pri);font-weight:600;margin-bottom:14px}
.filebox input{display:none}
fieldset.markbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px 2px;margin:0 0 16px;background:#fafcfb}
legend{font-size:13px;font-weight:700;color:var(--pri);padding:0 6px}
.tc-prev{font-size:13px;color:var(--mut);margin:-4px 0 12px}
.tc-prev b{color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--field);background:#fff;border-radius:12px;padding:11px 14px;font-weight:650;font-size:15px;text-decoration:none;color:var(--ink);min-height:46px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--done);border-color:var(--done);color:#fff}
.btn.danger{color:var(--late)}
.btn.full{width:100%}
.btn[disabled]{opacity:.6}

/* detail page */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.page .ttl{flex:1;font-weight:700;font-size:16px}
.page-body{max-width:760px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
.banner{display:flex;flex-direction:column;padding:10px 14px;border-radius:12px;background:var(--bgc);color:var(--c);font-size:14px}
.banner b{font-size:15px}
.subj-lg{font-size:19px;margin:14px 0 4px;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);margin:12px 0}
.kv dt{color:var(--mut);font-size:13px}.kv dd{margin:0;font-weight:550;font-size:14px}
.note-box{background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);margin:0 0 12px;border-left:4px solid var(--pri)}
.note-box.ok{border-left-color:var(--done)}
.note-box p{margin:4px 0 0;white-space:pre-wrap}
.filerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide{grid-column:1/-1}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px}
.tl li::before{content:"";position:absolute;left:4px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--pri)}
.tl li::after{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:#cdd6d1}
.tl li:last-child::after{display:none}
.tl b{font-size:14px}.tl small{color:var(--mut);display:block;font-size:12px}
.tl p{margin:3px 0 0;font-size:13.5px;white-space:pre-wrap}

/* bottom sheet, viewer, toast */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:rgba(10,20,15,.45);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;max-width:760px;margin:0 auto}
.sheet-wrap.open .sheet-bg{opacity:1}.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#c5cfca;margin:4px auto 10px}
.sheet h3{margin:4px 0 6px;font-size:18px}
.sheet .sub{margin:0 0 14px}
.viewer{position:fixed;inset:0;z-index:80;background:#0c0f0e;color:#fff;display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
.vbar span{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vimg{flex:1;overflow:auto;text-align:center}.vimg img{max-width:100%;height:auto}
.vpdf{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#14201b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--late)}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#bar.on{opacity:1}
#bar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:#7fd1a8;animation:bar 1s infinite ease-in-out}
@keyframes bar{from{left:-40%}to{left:100%}}

/* login, me, team */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(170deg,var(--pri) 0 40%,var(--bg) 40%)}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.login h1{margin:12px 0 0;font-size:24px}
.login .logo{width:54px;height:54px;background:var(--pri);color:#fff;border-radius:15px}
.login .logo svg{width:28px;height:28px}
.login form{margin-top:18px}
.demo{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:16px}
.panel ol{margin:6px 0 0;padding-left:20px;font-size:14px}
.prof{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none}
.menu{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.menu>*{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:14px;text-align:left;font-size:15px;color:var(--ink);text-decoration:none}
.menu>*:first-child{border-top:0}
.menu .danger{color:var(--late)}
.urow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:12px 14px;text-align:left}
.urow:first-child{border-top:0}
.urow .nm{flex:1;min-width:0}.urow .nm b{display:block}.urow .nm small{color:var(--mut)}
.role{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--pri-l);color:var(--pri);text-transform:uppercase;letter-spacing:.03em}
.role.off{background:#eee;color:#888}
.stat{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}.stat b{color:var(--late)}
.hol{display:flex;align-items:center;gap:8px;background:#fff6e0;color:#7a4b00;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;cursor:pointer}
.hrow{align-items:center}
.hrow .nm{flex:1;min-width:0}.hrow .nm b{display:block;font-weight:650}.hrow .nm small{color:var(--mut);font-size:12.5px}
.sm-btn{min-height:34px;padding:5px 12px;font-size:13px}
.sheet .panel label.check{font-size:14px}
/* v2: priority + time, freeze */
.s-frozen{--c:#6941c6;--bgc:#f4f0ff}.t-frozen{--c:#6941c6}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:10px}
.tile.wide b{font-size:24px}
.pt .ptrow{display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.ptopt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid var(--field);background:#fff;border-radius:12px;padding:8px 3px;font-weight:700;font-size:14px;min-height:60px;text-align:center;cursor:pointer;color:var(--ink);min-width:0}
.ptopt small{font-weight:500;font-size:11.5px;color:var(--mut)}
.ptopt.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.ptopt[data-p=Urgent].on{border-color:var(--today);background:var(--today-bg);color:var(--today);box-shadow:inset 0 0 0 1px var(--today)}
.ptopt[data-p=Immediate].on{border-color:var(--late);background:var(--late-bg);color:var(--late);box-shadow:inset 0 0 0 1px var(--late)}
.ptopt[data-p=Freeze].on{border-color:#6941c6;background:#f4f0ff;color:#6941c6;box-shadow:inset 0 0 0 1px #6941c6}
.ptopt select{margin:0!important;padding:3px 22px 3px 7px!important;font-size:13px!important;width:auto!important;max-width:100%;border-radius:8px!important;background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%!important}
/* v2: branches, install */
.brbar{margin-top:2px}
.brtag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:#eef3f0;color:var(--pri);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.brs{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.brs .brrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.brs .brrow label{margin:0;flex:1;display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:550;font-size:14px}
.brs .brrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
.brs select.chg{width:auto!important;margin:0!important;padding:6px 28px 6px 8px!important;font-size:13px!important;display:none}
form.is-head .brs select.chg{display:block}
.chgrow{align-items:center}
.chgrow select{width:auto!important;margin:0!important;padding:6px 28px 6px 8px!important;font-size:13px!important}
.chgrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.note-box.warn{border-left-color:#e0a100;background:#fffaf0;font-size:13.5px}
.instbar{display:flex;align-items:center;gap:8px;background:#e9f0fc;color:#1d4f9a;border-radius:12px;padding:8px 8px 8px 12px;margin-top:12px;font-size:14px}
.instbar span{flex:1;display:flex;align-items:center;gap:8px}
.icon.sm{width:32px;height:32px}
.ok-line{display:flex;gap:8px;align-items:center;color:var(--done);font-weight:600;margin:4px 0}
.steps{margin:6px 0 10px;padding-left:20px;font-size:14px}.steps li{margin-bottom:4px}
.charges{font-size:13px;color:var(--mut);margin-top:2px}
/* App 2: organisation, file chart, record */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin:0 0 12px;font-size:13.5px}
.crumbs button{border:0;background:#fff;border-radius:16px;padding:5px 10px;color:var(--pri);font-weight:600;display:inline-flex;align-items:center;gap:2px;box-shadow:var(--sh)}
.crumbs button svg{width:16px;height:16px}.crumbs span{color:var(--mut)}.crumbs b{padding:5px 2px}
.sendto{background:#f7faf8;border:1px solid var(--line);border-radius:14px;padding:10px 10px 2px;margin:0 0 12px}
.markbox .sendto{background:#fff}
.quick{margin:0 0 10px}.quick .chip{font-size:12.5px;padding:6px 10px;color:var(--pri);white-space:normal;text-align:left}
.where{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:12px;margin:10px 0 12px;text-align:left;box-shadow:var(--sh)}

/* ─────────────── File Chart: where the file started, every stop, where it lies now ─────────────── */
function chartStops(d, hist) {
  const stops = [];
  hist.slice().sort((a, b) => a.time - b.time).forEach(h => {
    const a = h.action || '', last = stops[stops.length - 1];
    const base = { time: h.time, by: h.user, unit: h.toUnit, person: h.toUser, due: h.due, note: h.note };
    if (a === 'File opened') stops.push(Object.assign(base, { kind: 'start', unit: h.toUnit || d.branch }));
    else if (/^(Marked|Sent|Re-marked|Reopened|Received|Returned)/.test(a) && h.toUser) stops.push(Object.assign(base, { kind: a === 'Reopened' ? 'reopen' : /^Returned/.test(a) ? 'returned' : /^Received/.test(a) ? 'scanned' : 'move' }));
    else if (/^Frozen/.test(a)) stops.push(Object.assign(base, { kind: 'frozen', unit: h.toUnit || (last && last.unit), person: h.toUser || (last && last.person) }));
    else if (/^Completed/.test(a)) stops.push(Object.assign(base, { kind: 'done', unit: h.toUnit || (last && last.unit), late: /late/.test(a) }));
    else if (a === 'Stored in record') stops.push(Object.assign(base, { kind: 'stored' }));
    else if (a === 'Taken out of record') stops.push(Object.assign(base, { kind: 'out' }));
    else if (a === 'Time extended' && last) (last.ext = last.ext || []).push(h.due);
    else if ((/^Receipt confirmed/.test(a) || a === 'File received') && last && !last.ack) last.ack = { time: h.time, by: h.user };
    else if (/^Returned/.test(a) && !h.toUser && last) last.ret = { time: h.time, by: h.user, note: h.note };
  });
  stops.forEach((x, i) => { x.end = stops[i + 1] ? stops[i + 1].time : null; });
  return stops;
}

function F_chart(d) {
  if (!S.hist) return `<div data-chart><h3>File chart</h3>${sub(d)}<div class="muted sm">Loading the file's journey…</div></div>`;
  const stops = chartStops(d, S.hist), now = Date.now(), N = chartNow(d);
  const path = [];
  stops.forEach(x => { if (x.unit && (x.kind === 'start' || x.kind === 'move' || x.kind === 'scanned' || x.kind === 'returned' || x.kind === 'reopen' || x.kind === 'stored') && path[path.length - 1] !== x.unit) path.push(x.unit); });
  const units = path.filter((u, i) => path.indexOf(u) === i).length;
  const first = stops[0];
  const total = first ? (d.status === 'COMPLETED' ? (d.completedAt || now) : d.status === 'STORED' ? (d.storedAt || now) : now) - first.time : 0;
  const li = (x, i) => {
    const last = i === stops.length - 1, stay = (x.end || now) - x.time;
    const lateBy = (x.kind === 'move' || x.kind === 'reopen' || x.kind === 'scanned' || x.kind === 'returned') && x.due && (x.end || now) > x.due ? (x.end || now) - x.due : 0;
    const showStay = (x.kind === 'start' && stay > 30 * 6e4) || x.kind === 'move' || x.kind === 'scanned' || x.kind === 'returned' || x.kind === 'reopen' || x.kind === 'frozen' || x.kind === 'out';
    const who = x.kind === 'stored' ? (x.note || '').split('  ·  ')[0] : x.person ? uname(x.person) : '';
    return `<li class="k-${x.kind}${last ? ' last' : ''}"><i></i><div class="fc-b">
      <div class="fc-t"><small>${KIND_TXT[x.kind]}</small><b>${esc(unitName(x.unit) || '—')}</b>${who ? `<span>${x.kind === 'stored' ? '' : '→ '}${esc(who)}</span>` : ''}</div>
      <div class="fc-m">${esc(fmtFull(x.time))}${x.by && x.kind !== 'start' ? ' · by ' + esc(uname(x.by)) : x.kind === 'start' ? ' · entered by ' + esc(uname(x.by)) : ''}${x.due ? ' · due ' + esc(fmtDT(x.due)) : ''}</div>
      ${x.ext ? `<div class="fc-m">Time extended → ${x.ext.map(t => esc(fmtDT(t))).join(', ')}</div>` : ''}
      ${x.ack ? `<div class="fc-m fc-ok">✓ Received · ${esc(fmtDT(x.ack.time))} · ${esc(uname(x.ack.by))}</div>` : x.kind === 'move' && last && !d.rcvdAt && d.status !== 'COMPLETED' && d.status !== 'STORED' ? `<div class="fc-m fc-bad">On its way — not yet received</div>` : ''}
      ${x.ret ? `<div class="fc-m fc-bad">↩ Returned by ${esc(uname(x.ret.by))} · ${esc(fmtDT(x.ret.time))}</div>` : ''}
      ${showStay ? `<div class="fc-p"><span class="pill2">${x.end ? 'stayed ' + dur(stay) : 'here for ' + dur(stay) + ' (now)'}</span>${lateBy ? `<span class="pill2 red">late by ${dur(lateBy)}</span>` : ''}</div>` : ''}</div></li>`;
  };
  return `<div data-chart><h3>File chart</h3>${sub(d)}
    ${d.fromOffice ? `<p class="sm">Came from: <b dir="auto">${esc(d.fromOffice)}</b>${d.receivedOn ? ' · received ' + esc(fmtDay(d.receivedOn)) : ''}</p>` : ''}
    <div class="fc-path">${path.map((u, i) => `${i ? '<em>›</em>' : ''}<span class="${i === path.length - 1 ? 'on' : ''}">${esc(unitName(u))}</span>`).join('')}</div>
    <div class="fc-sum"><div><b>${stops.filter(x => x.kind === 'move' || x.kind === 'scanned' || x.kind === 'returned' || x.kind === 'reopen').length}</b><small>movements</small></div><div><b>${units}</b><small>offices</small></div><div><b>${first ? dur(total) : '—'}</b><small>${d.status === 'COMPLETED' || d.status === 'STORED' ? 'total time' : 'open since'}</small></div></div>
    <ol class="fchart">${stops.map(li).join('')}</ol>
    <div class="fc-now s-${N.cls}"><small>${esc(N.t)}</small><b dir="auto">${esc(N.b)}</b><span>${esc(N.m)}</span></div></div>`;
}

  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  pushNav();
}

/** Two drop-downs: wing (Chairperson direct / Secretary wing / Controller wing), then the branches of that wing. */
function wingPicker(sel, allowed, title) {
  const ok = id => !allowed || allowed.indexOf(id) >= 0;
  const ws = wings().filter(w => wingUnits(w.id).some(u => ok(u.id)));
  const w0 = sel && unitById(sel) ? wingOf(sel) : (ws[0] || {}).id;
  return `<div class="sendto"><div class="lbl" style="margin-top:0">${esc(title)}</div><label>Wing<select name="wing" data-change="wingSel">${ws.map(w => `<option value="${esc(w.id)}" ${w.id === w0 ? 'selected' : ''}>${esc(wingLabel(w.id))}</option>`).join('')}</select></label>
    <label>Branch / section<select name="unit" data-allowed="${allowed ? esc(allowed.join(',')) : ''}">${branchOpts(w0, sel, allowed)}</select></label></div>`;
}
function branchOpts(w, sel, allowed) {
  return `<option value="">— Choose branch —</option>` + wingUnits(w).filter(u => !allowed || allowed.indexOf(u.id) >= 0)
    .map(u => `<option value="${esc(u.id)}" ${u.id === sel ? 'selected' : ''}>${esc(unitLabel(u.id))}${headNames(u.id) ? ' — ' + esc(headNames(u.id)) : ''}</option>`).join('');

function updUser(u) {
  const i = S.users.findIndex(x => x.username === u.username);
  if (i >= 0) S.users[i] = u; else S.users.push(u);
  if (u.username === S.me.username) Object.assign(S.me, u);
}

/* ─────────────── QR: label, scanner, receive / return ─────────────── */
/** The link inside the QR: the installed app's own address (GitHub Pages), whichever account it is on. */
const appHome = () => (MODE === 'http' ? location.origin + location.pathname : (S.cfg.appUrl || location.origin + location.pathname)).split('#')[0].split('?')[0];
/** Inside the QR: the link that opens this file's Move / Receive screen — the Apps Script link when the app runs there. */
const qrLink = d => (MODE === 'gas' && S.cfg.execUrl ? S.cfg.execUrl.split('?')[0].split('#')[0] + '?f=' : appHome() + '#f=') + d.id + '-' + d.qr;
function qrSvg(text, quiet) {
  const q = new QRLib.QRCode(-1, text.length > 80 ? QRLib.Level.L : QRLib.Level.M);   // long Apps Script links: fewer, bigger squares
  q.addData(text); q.make();
  const n = q.getModuleCount(), m = quiet == null ? 4 : quiet;
  let p = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) p += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return `<svg class="qr" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`;
}
function printLabel(d) {
  let a = $('#printArea');
  if (!a) { a = document.createElement('div'); a.id = 'printArea'; document.body.appendChild(a); }
  const one = `<div class="plabel">${qrSvg(qrLink(d), 2)}<div class="pl-t"><div class="pl-row"><span class="pl-no">File #${esc(d.diaryNo)}</span><span class="pl-code">${esc(d.id)}-${esc(d.qr)}</span></div><span class="pl-sub" dir="auto">${esc(String(d.subject).toUpperCase())}</span><span class="pl-meta">FTS · ${esc(S.cfg.org)} · ${esc(unitName(d.branch))} · ${esc(fmtDay(d.receivedOn))}</span></div></div>`;
  a.innerHTML = one;
  document.body.classList.add('printing');
  try { window.print(); } catch (e) { toast('Printing is not allowed here', 'err'); }
  setTimeout(() => document.body.classList.remove('printing'), 800);
}
/** The same strip label as a picture (1535 × 260 px ≈ 130 × 22 mm at 300 dpi) — to copy into Word or save. */
function labelCanvas(d) {
  const W = 1535, H = 260, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.setLineDash([10, 8]); g.strokeStyle = '#777'; g.lineWidth = 3; g.strokeRect(4, 4, W - 8, H - 8); g.setLineDash([]);
  const link = qrLink(d), q = new QRLib.QRCode(-1, link.length > 80 ? QRLib.Level.L : QRLib.Level.M); q.addData(link); q.make();
  const n = q.getModuleCount(), size = 220, cell = size / (n + 4), x0 = 20, y0 = (H - size) / 2;
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect(Math.floor(x0 + (k + 2) * cell), Math.floor(y0 + (r + 2) * cell), Math.ceil(cell), Math.ceil(cell));
  const tx = x0 + size + 30, maxW = W - tx - 30, fit = (t, w) => { t = String(t || ''); while (t.length > 3 && g.measureText(t).width > w) t = t.slice(0, -2); return t === String(t) ? t : t; };
  g.textBaseline = 'alphabetic';
  g.font = '800 46px Inter, Arial, sans-serif'; g.fillText('File #' + d.diaryNo, tx, 80);
  const code = d.id + '-' + d.qr; g.font = '700 38px Consolas, Menlo, monospace';
  const cw = g.measureText(code).width; g.lineWidth = 3; g.strokeStyle = '#000'; g.strokeRect(W - 30 - cw - 24, 38, cw + 24, 54); g.fillText(code, W - 30 - cw - 12, 78);
  g.font = '500 36px Inter, Arial, sans-serif';
  let sub = String(d.subject || '').toUpperCase(); if (g.measureText(sub).width > maxW) { while (sub.length > 3 && g.measureText(sub + '…').width > maxW) sub = sub.slice(0, -1); sub += '…'; }
  g.fillText(sub, tx, 140);
  g.font = '400 26px Inter, Arial, sans-serif'; g.fillStyle = '#222';
  g.fillText(fit('FTS · ' + S.cfg.org + ' · ' + unitName(d.branch) + ' · ' + fmtDay(d.receivedOn), maxW), tx, 200);
  return c;
}
function rcvPeople(unitId, sel) {
  const ppl = loginUsers().filter(u => u.active && userUnitIds(u).indexOf(unitId) >= 0);
  const head = ppl.find(u => u.role === 'HEAD' && userUnitIds(u).indexOf(unitId) >= 0);
  const def = sel && ppl.some(u => u.username === sel) ? sel : head ? head.username : S.me.username;
  const order = { HEAD: 0, DAK_INCHARGE: 1, STAFF: 2 };
  ppl.sort((a, b) => order[a.role] - order[b.role] || a.name.localeCompare(b.name));
  return ppl.map(u => `<option value="${esc(u.username)}" ${u.username === def ? 'selected' : ''}>${esc(u.name)}${u.username === S.me.username ? ' (me)' : ''}${u.role === 'HEAD' ? ' — Officer' : u.role === 'DAK_INCHARGE' ? ' — Dak Incharge' : ''}</option>`).join('');
}
function parseScan(text) {
  const t = String(text || '').trim().toUpperCase();
  const m = t.match(/[#?&]F=(\d+)-([A-Z0-9]{6})/) || t.replace(/\s+/g, '').match(/^(\d+)[-_./]?([A-Z0-9]{6})$/);
  return m ? { id: m[1], code: m[2] } : null;
}
async function gotCode(text) {
  const box = $('#sheet [data-scanmsg]');
  const p = parseScan(text);
  if (!p) { if (box) box.innerHTML = '<p class="err-line">This is not an FTS file code. The code looks like 12-K7Q2M9.</p>'; return; }
  stopCam();
  try {
    const info = await call('scan', { id: p.id, code: p.code });
    S.scanInfo = info;
    showSheetContent(F.scanResult(info, p.code));
  } catch (e) { if (box) box.innerHTML = `<p class="err-line">${esc(e.message)}</p>`; else toast(e.message, 'err'); }
}
async function startCam() {
  const box = $('#sheet [data-cam]');
  if (!box) return;
  const off = msg => { box.classList.add('off'); box.innerHTML = `<div class="cam-off">${I.scan}<p>${msg}</p></div>`; };
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return off('Live scanning is not available in this browser. Tap <b>Take photo of the QR</b>, or scan the QR with the phone\'s own <b>camera</b> / Google Lens — it opens FTS on this file. Or type the code below.');
  try {
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = box.querySelector('video');
    if (!v || !v.isConnected) { stream.getTracks().forEach(t => t.stop()); return; }
    S.cam = stream; v.srcObject = stream; await v.play();
    const tick = async () => {
      if (!S.cam || !v.isConnected) return stopCam();
      try { const r = await det.detect(v); if (r && r.length) return gotCode(r[0].rawValue); } catch (e) {}
      setTimeout(tick, 220);
    };
    tick();
  } catch (e) { off('The live camera is not allowed here. Tap <b>Take photo of the QR</b> below — or scan the QR with the phone\'s own camera, or type the code.'); }
}
function stopCam() { if (S.cam) { try { S.cam.getTracks().forEach(t => t.stop()); } catch (e) {} S.cam = null; } }
/** A QR scanned with the phone camera opens  …/#f=12-K7Q2M9 : remember it until the person is signed in. */
function deepLink() {
  const m = location.hash.match(/^#f=(\d+)-([A-Za-z0-9]{6})$/);
  if (!m) return;
  try { sessionStorage.setItem('fts_scan', m[1] + '-' + m[2]); } catch (e) {}
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
function pendingScan() {
  let v = window.FTS_SCAN || null;
  window.FTS_SCAN = null;
  if (!v) { try { v = sessionStorage.getItem('fts_scan'); sessionStorage.removeItem('fts_scan'); } catch (e) {} }
  if (!v) return;
  if (!S.me) { try { sessionStorage.setItem('fts_scan', v); } catch (e) {} return; }   // after sign-in
  if ($('#sheet').classList.contains('open')) showSheetContent(F.scanner()); else openSheet(F.scanner());
  gotCode(v);
}
/** A photo of the QR, taken with the phone camera (works even where the live camera is not allowed). */
async function scanPhoto(input) {
  const file = input.files && input.files[0];
  const box = $('#sheet [data-scanmsg]');
  input.value = '';
  if (!file) return;
  if (!('BarcodeDetector' in window)) { if (box) box.innerHTML = '<p class="err-line">This phone cannot read a QR from a photo inside the app. Scan the QR with the phone\'s own camera (it opens FTS on this file), or type the code under the QR.</p>'; return; }
  if (box) box.innerHTML = '<p class="muted">Reading the QR…</p>';
  try {
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    let r = await det.detect(await createImageBitmap(file));
    if (!r.length) r = await det.detect(await createImageBitmap(file, { resizeWidth: 1400, resizeQuality: 'high' }));
    if (r.length) gotCode(r[0].rawValue);
    else if (box) box.innerHTML = '<p class="err-line">No QR found in the photo. Take it again, closer and straight, in good light.</p>';
  } catch (e) { if (box) box.innerHTML = '<p class="err-line">The photo could not be read. Try again, or type the code under the QR.</p>'; }
}

/* ─────────────── files ─────────────── */
function readFile(file) {
  return new Promise((res, rej) => {
    if (/^image\//.test(file.type)) {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res({ name: (file.name || 'letter').replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.75).split(',')[1] });
      };
      img.onerror = () => rej(new Error('Could not read this image'));
      img.src = url;
    } else {
      if (file.size > 8 * 1048576) return rej(new Error('File is larger than 8 MB'));
      const r = new FileReader();
      r.onload = () => res({ name: file.name, mime: file.type || 'application/pdf', data: String(r.result).split(',')[1] });
      r.onerror = () => rej(new Error('Could not read this file'));
      r.readAsDataURL(file);
    }
  });
}
function showViewer(f) {
  const v = $('#viewer'), isImg = /^image\//.test(f.mime);
  let url;
  if (isImg) url = 'data:' + f.mime + ';base64,' + f.data;
  else { const bin = atob(f.data), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); url = URL.createObjectURL(new Blob([u8], { type: f.mime })); }
  v.innerHTML = `<div class="vbar"><span>${esc(f.name)}</span><button class="icon" data-act="back" aria-label="Close">${I.x}</button></div>` +
    (isImg ? `<div class="vimg"><img src="${url}" alt="Scanned letter"></div>`
      : `<div class="vpdf">${I.clip}<p>${esc(f.name)}</p><a class="btn pri" href="${url}" target="_blank" rel="noopener">Open file</a><a class="btn" href="${url}" download="${esc(f.name)}">Download</a></div>`);
  v.classList.remove('hide'); pushNav();
}
